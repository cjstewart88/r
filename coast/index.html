<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>potato patch</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1c20;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      /* potato patch — ellijay, ga. 39.5 miles, 4731 feet of up.
         the climbing is never ending, the terrain is perfect,
         and the views are about as good as it gets. */

      const out = document.getElementById("c");
      const dx = out.getContext("2d", { alpha: false });
      const buf = document.createElement("canvas");
      const ctx = buf.getContext("2d", { alpha: false, willReadFrequently: true });

      let W = 0, H = 0, DW = 0, DH = 0, PIX = 4, F = 0, horizon = 0, LOW = false;
      let t = 0, last = 0, ms = 16, frames = 0;

      const RH = 1.95;      // half width of the forest road
      const SHD = 0.8;      // the litter and gravel at its edge
      const LANE = 1.35;    // he keeps to the road
      const SEG = 5;        // one length of road
      const VIEW = 340;     // the trees close in, so you can't see far
      const CAMH = 2.2;
      const DZR = 6.2, DZF = 7.55;
      const ROUTE = 7000;   // the whole loop, in metres of the small world
      const MILES = 39.5;
      const mileOf = (Z) => (Z / ROUTE) * MILES;

      let camZ = 0, camX = 0, camY = 0, riderX = 0, dist = 0, gain = 0;
      let spd = 0, steer = 0, lean = 0, crank = 0, stop = 0, still = 0, grade = 0;
      let hint = 1, wind = 0, buddy = 42;
      const keys = new Set();

      /* ================= the colours of a february ridge ================= */

      const HEX = [
        // overcast, which is most of the sky
        "f2f4f6", "e4e8ec", "d4dae0", "c2cad3", "aeb8c2", "98a3b0", "828d9c",
        // the ridges, going blue with distance
        "6c7c92", "5a6a80", "4a5870", "3c4860", "2e3a4e",
        // bare hardwood
        "a89a8a", "8d8072", "756a5e", "5e544b", "48403a", "36302b", "24201d",
        // dead leaves on the ground
        "c08a56", "a86e42", "8f5a34", "7a4a2c", "62381f", "4a2a18",
        // dry winter grass
        "c4ad84", "a8916a", "8a7454", "6c5a40",
        // rhododendron and the pines that stay
        "2a382c", "384a3a", "48604a", "5c7a5e", "76966f",
        // the road: dirt, stone, and later asphalt
        "9c9184", "857a6e", "6e6459", "5a5148", "463f38", "322d28",
        "7c7e84", "62646a", "4c4e52", "3a3c40",
        // ice, snow, cloud edge
        "ffffff", "eef2f5", "dae2e8",
        // hi-vis, helmets, an orange bike, a red barn
        "d8e04a", "b4c038", "e07a1e", "c85a18", "8a2f26", "b04a30",
        "12131a", "1e2028", "2c3038",
      ];

      const PALR = [], PALG = [], PALB = [];
      for (const h of HEX) {
        PALR.push(parseInt(h.slice(0, 2), 16));
        PALG.push(parseInt(h.slice(2, 4), 16));
        PALB.push(parseInt(h.slice(4, 6), 16));
      }
      const NP = PALR.length;

      let LUT = null;
      function buildLUT() {
        LUT = new Uint8Array(32768);
        for (let i = 0; i < 32768; i++) {
          const r = (i >> 10 & 31) * 8.2258, g = (i >> 5 & 31) * 8.2258, b = (i & 31) * 8.2258;
          let best = 0, bd = 1e12;
          for (let p = 0; p < NP; p++) {
            const dr = r - PALR[p], dg = g - PALG[p], db = b - PALB[p];
            const d = dr * dr * 0.9 + dg * dg * 1.18 + db * db * 0.72;
            if (d < bd) { bd = d; best = p; }
          }
          LUT[i] = best;
        }
      }

      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      const SPREAD = 2.5;

      function crush() {
        const img = ctx.getImageData(0, 0, W, H);
        const d = img.data;
        let i = 0;
        for (let y = 0; y < H; y++) {
          const row = (y & 3) << 2;
          for (let x = 0; x < W; x++, i += 4) {
            const o = (BAYER[row + (x & 3)] - 7.5) * SPREAD;
            let r = d[i] + o, g = d[i + 1] + o, b = d[i + 2] + o;
            r = r < 0 ? 0 : r > 255 ? 255 : r;
            g = g < 0 ? 0 : g > 255 ? 255 : g;
            b = b < 0 ? 0 : b > 255 ? 255 : b;
            const p = LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)];
            d[i] = PALR[p];
            d[i + 1] = PALG[p];
            d[i + 2] = PALB[p];
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      /* ================= the profile ================= */

      // mile, feet. mulberry gap, up into the cohutta, out to the fire tower
      // on grassy mountain, then down and down and home the long way.
      const PROF = [
        [0, 1750], [1, 2050], [2, 2360], [3, 2600], [4, 2780], [5, 3020], [6, 3200],
        [7.5, 2990], [9, 3300], [10.2, 3040], [11.5, 3120], [12.6, 3420], [13.7, 3692],
        [14.8, 3400], [16, 3150], [17.1, 3040], [20, 2500], [23, 1950], [26, 1520],
        [27, 1400], [29, 1150], [31, 1180], [33, 1120], [35, 1200], [35.5, 1250],
        [37, 1450], [38.5, 1650], [39.5, 1750],
      ];
      // the real climb averages 4.6%. compressing 39.5 miles into 7000 metres would
      // stand it on end, so the vertical gets squashed to keep the grades rideable.
      const BASE_FT = 1750, VS = 0.11, EST = 2.5;
      let ETAB = null, FTAB = null;

      function feetAt(mi) {
        if (mi <= 0) return PROF[0][1];
        if (mi >= MILES) return PROF[PROF.length - 1][1];
        let i = 0;
        while (i < PROF.length - 2 && PROF[i + 1][0] < mi) i++;
        const a = PROF[i], b = PROF[i + 1];
        const u = (mi - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1] - a[1]) * (u * u * (3 - 2 * u));
      }

      function buildProfile() {
        const n = Math.ceil(ROUTE / EST) + 2;
        ETAB = new Float32Array(n);
        FTAB = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          const Z = i * EST;
          const ft = feetAt(mileOf(Z));
          // the road never actually lies flat, so neither does this. the rollers
          // are most of why the day adds up to 4731 feet and not three thousand.
          const roll = Math.sin(Z * 0.035) * 0.45 + Math.sin(Z * 0.019 + 1.1) * 0.28;
          FTAB[i] = ft + roll * 21.8;
          ETAB[i] = (ft - BASE_FT) * 0.3048 * VS + roll;
        }
      }
      // seven thousand metres of world cannot hold 39.5 miles of real undulation, so
      // the climbing it does hold is scaled to land on the day's actual 4731 feet.
      let GAINK = 1;
      function calibrate() {
        let g = 0;
        for (let i = 1; i < FTAB.length; i++) g += Math.max(0, FTAB[i] - FTAB[i - 1]);
        GAINK = g > 0 ? 4731 / g : 1;
      }
      function tab(T, Z) {
        const u = Z / EST;
        if (u <= 0) return T[0];
        if (u >= T.length - 1) return T[T.length - 1];
        const i = u | 0;
        return T[i] + (T[i + 1] - T[i]) * (u - i);
      }
      const elev = (Z) => tab(ETAB, Z);
      const feetZ = (Z) => tab(FTAB, Z);

      /* ================= the light, over one day of riding ================= */

      // keyed to how far round the loop you are, because that is how a day goes
      const LIGHT = [
        { m: 0, top: [58, 68, 92], bot: [126, 132, 148], gnd: [58, 50, 44], ridge: [46, 56, 74], lit: 0.34, blue: 0.1 },
        { m: 2.5, top: [122, 138, 162], bot: [196, 202, 210], gnd: [96, 76, 58], ridge: [78, 90, 110], lit: 0.72, blue: 0.2 },
        { m: 7, top: [176, 186, 198], bot: [226, 231, 236], gnd: [116, 92, 66], ridge: [102, 116, 136], lit: 0.9, blue: 0.15 },
        { m: 13.7, top: [198, 206, 216], bot: [240, 244, 247], gnd: [124, 104, 82], ridge: [126, 142, 162], lit: 1, blue: 0.1 },
        { m: 20, top: [168, 180, 196], bot: [220, 226, 233], gnd: [112, 90, 64], ridge: [96, 110, 132], lit: 0.9, blue: 0.25 },
        { m: 29, top: [116, 146, 186], bot: [222, 224, 220], gnd: [128, 108, 70], ridge: [88, 104, 128], lit: 0.95, blue: 0.7 },
        { m: 34, top: [104, 136, 184], bot: [240, 214, 168], gnd: [140, 110, 66], ridge: [92, 100, 124], lit: 0.9, blue: 0.75 },
        { m: 37.5, top: [86, 100, 148], bot: [232, 168, 116], gnd: [110, 82, 52], ridge: [72, 76, 104], lit: 0.62, blue: 0.5 },
        { m: 39.5, top: [46, 54, 86], bot: [128, 116, 128], gnd: [58, 46, 38], ridge: [46, 50, 70], lit: 0.34, blue: 0.2 },
        { m: 60, top: [26, 30, 52], bot: [62, 62, 82], gnd: [36, 30, 26], ridge: [32, 34, 50], lit: 0.2, blue: 0.1 },
      ];
      const PAL = { top: [0, 0, 0], bot: [0, 0, 0], gnd: [0, 0, 0], ridge: [0, 0, 0], haze: [0, 0, 0], lit: 1, blue: 0 };
      let mile = 0, dusk = 0;

      function lerp3(a, b, u, o) {
        o[0] = a[0] + (b[0] - a[0]) * u;
        o[1] = a[1] + (b[1] - a[1]) * u;
        o[2] = a[2] + (b[2] - a[2]) * u;
      }

      function light() {
        mile = mileOf(camZ);
        let i = 0;
        while (i < LIGHT.length - 2 && LIGHT[i + 1].m < mile) i++;
        const a = LIGHT[i], b = LIGHT[i + 1];
        const u = Math.max(0, Math.min(1, (mile - a.m) / (b.m - a.m)));
        const e = u * u * (3 - 2 * u);
        for (const k of ["top", "bot", "gnd", "ridge"]) lerp3(a[k], b[k], e, PAL[k]);
        PAL.lit = a.lit + (b.lit - a.lit) * e;
        PAL.blue = a.blue + (b.blue - a.blue) * e;
        // the haze the ridges dissolve into is just the bottom of the sky
        lerp3(PAL.bot, PAL.ridge, 0.22, PAL.haze);
        dusk = 1 - PAL.lit;
      }

      const tmp = [0, 0, 0];
      const rgb = (c) => "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
      const rgba = (c, a) => "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")";

      function shade(c, z, k) {
        const f = Math.min(1, Math.pow(Math.max(z, 0) / VIEW, 0.55));
        const g = (k === undefined ? 1 : k) * (0.26 + 0.74 * PAL.lit);
        for (let i = 0; i < 3; i++) tmp[i] = c[i] * g + (PAL.haze[i] - c[i] * g) * f * 0.92;
        return rgb(tmp);
      }

      function hs(i, s) {
        const x = Math.sin(i * 127.1 + s * 311.7 + 0.37) * 43758.5453;
        return x - Math.floor(x);
      }

      /* ================= where things are on the loop ================= */

      const between = (a, b) => mile >= a && mile <= b;
      // rime ice lives up high and only while it is still cold
      const iceAt = (Z) => Math.max(0, Math.min(1, (feetZ(Z) - 3050) / 350)) * (mileOf(Z) < 17.5 ? 1 : 0);
      const paved = (Z) => { const m = mileOf(Z); return m > 29 && m < 35.5; };
      // the creeks that run beside you
      function creek(Z) {
        const m = mileOf(Z);
        if (m > 3.3 && m < 4.8) return 1;
        if (m > 18 && m < 27) return 1;
        return 0;
      }
      // where the forest opens and lets you see out
      function open(Z) {
        const m = mileOf(Z);
        if (m > 5.1 && m < 5.9) return 1;      // the unobstructed view
        if (m > 13.2 && m < 14.2) return 1;    // the top of grassy mountain
        if (m > 17.6 && m < 18.4) return 1;    // another lookout worth stopping at
        if (m > 28.6 && m < 35.6) return 1;    // farmland
        return 0;
      }

      const MARKS = [
        [0.25, ["mulberry gap"]],
        [1.3, ["cohutta wildlife", "management area"]],
        [2.6, ["settle in.", "six miles of climbing"]],
        [4.0, ["barnes creek", "rushing water"]],
        [5.3, ["you can't miss it"]],
        [6.0, ["old houses on the ridge", "questioning everything"]],
        [6.7, ["top of a six mile climb"]],
        [10.2, ["right for the loop", "left for the fire tower"]],
        [11.6, ["grassy mountain"]],
        [12.7, ["the trees are coated in ice"]],
        [13.7, ["an icy blue silhouette", "of the closest mountains"]],
        [17.6, ["ten miles of down", "stay alert"]],
        [21.0, ["mill creek, coming down with you"]],
        [29.0, ["asphalt.", "the first your tyres have seen"]],
        [30.2, ["grassy mountain, back there", "holy shit"]],
        [35.6, ["gravel again", "don't celebrate too quick"]],
        [37.6, ["some soul crushing miles"]],
        [39.2, ["an old mountain truck"]],
        [39.5, ["mulberry gap.", "that kicked your ass"]],
      ];
      let markI = 0, markT = 99, markLines = null;

      /* ================= the small alphabet ================= */

      const GLYPH = {
        a: "25755", b: "65656", c: "34443", d: "65556", e: "74647", f: "74644", g: "34553",
        h: "55755", i: "72227", j: "11152", k: "55655", l: "44447", m: "57755", n: "57775",
        o: "25552", p: "65644", q: "25573", r: "65655", s: "34216", t: "72222", u: "55557",
        v: "55552", w: "55775", x: "55255", y: "55222", z: "71247",
        0: "75557", 1: "26227", 2: "71747", 3: "71317", 4: "55711", 5: "74717",
        6: "74757", 7: "71222", 8: "75757", 9: "75717", ".": "00002", ",": "00022",
        "'": "22000", "-": "00700", " ": "00000",
      };
      function say(str, cx, y, fill, alpha) {
        if (alpha <= 0.02) return;
        let x = Math.round(cx - (str.length * 4 - 1) / 2);
        ctx.save();
        ctx.globalAlpha = Math.min(1, alpha);
        ctx.fillStyle = fill;
        for (const ch of str) {
          const g = GLYPH[ch];
          if (g) {
            for (let r = 0; r < 5; r++) {
              const b = +g[r];
              if (b & 4) ctx.fillRect(x, y + r, 1, 1);
              if (b & 2) ctx.fillRect(x + 1, y + r, 1, 1);
              if (b & 1) ctx.fillRect(x + 2, y + r, 1, 1);
            }
          }
          x += 4;
        }
        ctx.restore();
      }

      /* ================= projection over a road that goes up ================= */

      function pj(x, h, z) {
        const s = F / z;
        return { x: W / 2 + (x - camX) * s, y: horizon - (elev(camZ + z) + h - camY) * s, s };
      }
      const gx = (x, z) => W / 2 + (x - camX) * (F / z);
      const gy = (z) => horizon - (elev(camZ + z) - camY) * (F / z);

      function R(x, y, w, h, fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
      }

      /* ================= sky and the country beyond ================= */

      function sky() {
        // everything below the skyline starts as far haze. when the road drops away
        // there is a gap between the horizon and the nearest ground, and that gap is
        // the valley you are about to descend into, not a hole in the world.
        lerp3(PAL.haze, PAL.gnd, 0.18, tmp);
        ctx.fillStyle = rgb(tmp);
        ctx.fillRect(0, horizon, W, H - horizon);

        const g = ctx.createLinearGradient(0, 0, 0, horizon + 2);
        g.addColorStop(0, rgb(PAL.top));
        g.addColorStop(0.78, rgb(PAL.bot));
        g.addColorStop(1, rgb(PAL.haze));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, horizon + 2);

        // overcast, in long flat sheets. it broke open on the way home.
        const cloud = 1 - PAL.blue;
        if (cloud > 0.06) {
          const k0 = Math.floor((camZ - 400) / 260), k1 = Math.floor((camZ + 3000) / 260);
          for (let k = k1; k >= k0; k--) {
            if (hs(k, 5) > 0.55 + cloud * 0.4) continue;
            const y = horizon - (18 + hs(k, 6) * 0.7 * horizon) - (k % 3) * 2;
            if (y < 2) continue;
            lerp3(PAL.bot, [252, 253, 255], 0.4 * cloud, tmp);
            const a = (0.1 + hs(k, 8) * 0.16) * cloud;
            const w = W * (0.35 + hs(k, 7) * 0.8);
            const x = ((hs(k, 9) * 1.6 - 0.3) * W + camZ * 0.02) % (W * 1.9) - W * 0.45;
            ctx.globalAlpha = a;
            R(x, y, w, Math.max(1, 1 + hs(k, 10) * 2), rgb(tmp));
            R(x + w * 0.14, y + 1 + hs(k, 11) * 2, w * 0.7, 1, rgb(tmp));
            ctx.globalAlpha = 1;
          }
        }
      }

      // the blue ridges, stacked back to the state line
      function ridges() {
        const seen = open(camZ) ? 1 : 0.34;
        for (let layer = 0; layer < 3; layer++) {
          const amp = horizon * (layer === 0 ? 0.3 : layer === 1 ? 0.2 : 0.12) * (0.5 + seen * 0.5);
          const ph = camZ * (0.0006 + layer * 0.0007) + layer * 3.1;
          lerp3(PAL.ridge, PAL.haze, layer === 0 ? 0.66 : layer === 1 ? 0.4 : 0.16, tmp);
          ctx.fillStyle = rgb(tmp);
          ctx.beginPath();
          ctx.moveTo(0, horizon + 2);
          for (let x = 0; x <= W; x += 2) {
            const u = x / W * (3 + layer * 1.3) + ph;
            const n = 0.4 + 0.3 * Math.sin(u) + 0.22 * Math.sin(u * 2.1 + 1.7) + 0.16 * Math.sin(u * 4.3 + 0.4);
            const y = horizon + 2 - Math.round(amp * n);
            ctx.lineTo(x, y);
            ctx.lineTo(x + 2, y);
          }
          ctx.lineTo(W, horizon + 3);
          ctx.lineTo(0, horizon + 3);
          ctx.fill();
        }
      }

      /* ================= the road, one length at a time ================= */

      // near to far, keeping the highest thing painted so a crest hides what is behind it
      let TOPS = null;
      function road() {
        const i0 = Math.floor((camZ + 1.6) / SEG), i1 = Math.floor((camZ + VIEW) / SEG);
        // `top` exists only to stop a far length of road painting back down over a
        // nearer crest. It must start off the bottom of the world, not at the bottom
        // of the screen: the closest segment belongs way below the frame, and pulling
        // its near edge up to H while its width still comes from z=1.6 folds all the
        // foreshortening into a few pixels and kinks the road right behind the bike.
        let top = 1e6;
        TOPS = { i0, i1, y: new Float32Array(i1 - i0 + 2) };

        for (let i = i0; i <= i1; i++) {
          const zn = Math.max(1.6, i * SEG - camZ), zf = (i + 1) * SEG - camZ;
          const yf = gy(zf);
          TOPS.y[i - i0] = top;
          if (yf >= top - 0.02) continue;             // over the top of a nearer rise
          const yn = Math.min(gy(zn), top);
          const Z = i * SEG;
          const road2 = paved(Z);
          const f = Math.min(1, Math.pow(zn / VIEW, 0.55));

          // the mountainside, full width
          lerp3(PAL.gnd, PAL.haze, f * 0.92, tmp);
          const dark = (i & 1) ? 1 : 0.94;
          tmp[0] *= dark; tmp[1] *= dark; tmp[2] *= dark;
          ctx.fillStyle = rgb(tmp);
          ctx.fillRect(0, Math.round(yf), W, Math.round(yn) - Math.round(yf) + 1);

          quad(-(RH + SHD), RH + SHD, zn, zf, yn, yf, shade([122, 84, 52], zn, (i & 1) ? 1 : 0.9));
          const base = road2 ? [86, 88, 94] : [138, 128, 116];
          quad(-RH, RH, zn, zf, yn, yf, shade(base, zn, (i & 1) ? 1 : 0.95));

          if (!road2) {
            // two ruts, and whatever grows down the middle where no tyre goes
            quad(-1.5, -0.62, zn, zf, yn, yf, shade([92, 80, 68], zn, 1));
            quad(0.62, 1.5, zn, zf, yn, yf, shade([92, 80, 68], zn, 1));
            if (zn < 90) quad(-0.34, 0.34, zn, zf, yn, yf, shade([120, 106, 74], zn, 0.9));
          }
          if (creek(Z) && zn < 150) {
            const w = 0.55 + hs(i, 61) * 0.5;
            quad(-(RH + SHD + 2.2 + w), -(RH + SHD + 2.2), zn, zf, yn, yf, shade([96, 112, 126], zn, 1.05));
            if (hs(i, 62) < 0.5) quad(-(RH + SHD + 2.2 + w * 0.6), -(RH + SHD + 2.0), zn, zf, yn, yf, shade([224, 234, 238], zn, 1));
          }
          top = yf;
        }
        TOPS.y[i1 - i0 + 1] = top;
      }
      function topAt(z) {
        if (!TOPS) return H;
        const i = Math.floor((camZ + z) / SEG) - TOPS.i0;
        if (i < 0) return H;
        if (i >= TOPS.y.length) return TOPS.y[TOPS.y.length - 1];
        return TOPS.y[i];
      }

      // The ground is a ribbon that only knows about distance, so sideways it runs flat
      // forever. On a climb its far edge sits above the horizon and reads as a bare
      // plateau rearing up behind you. It isn't a plateau — it's woods, all the way out.
      // So every length of road gets a wall of trees either side of it, far to near.
      function forest() {
        if (!TOPS) return;
        for (let i = TOPS.i1; i >= TOPS.i0; i--) {
          const zf = (i + 1) * SEG - camZ;
          // only the far mass, where individual trees would be a pixel wide anyway
          if (zf < 150) continue;
          const Z = i * SEG;
          if (open(Z)) continue;
          if (gy(zf) >= TOPS.y[i - TOPS.i0] - 0.02) continue;   // over a nearer rise
          const yf = gy(zf), s = F / zf;
          const th = (14 + hs(i, 201) * 7) * s;
          if (th < 1.2 || th > 26) continue;

          const f = Math.min(1, Math.pow(zf / VIEW, 0.5));
          const ice = iceAt(Z);
          lerp3([84, 76, 68], [214, 224, 232], ice * 0.7, tmp);
          const g2 = 0.3 + 0.7 * PAL.lit;
          tmp[0] *= g2; tmp[1] *= g2; tmp[2] *= g2;
          lerp3(tmp, PAL.haze, f * 0.9, tmp);
          const c = rgb(tmp);

          const xl = gx(-(RH + SHD + 1.2), zf), xr = gx(RH + SHD + 1.2, zf);
          for (let n = 0; n < 3; n++) {
            const hh = th * (0.62 + hs(i * 3 + n, 202) * 0.55);
            const lw = (xl + 3) / 3;
            if (lw > 0.6) R(-2 + n * lw, yf - hh, lw + 1, hh + 1, c);
            const rw = (W + 2 - xr) / 3;
            if (rw > 0.6) R(xr + n * rw, yf - th * (0.62 + hs(i * 3 + n, 203) * 0.55), rw + 1, th + 1, c);
          }
        }
      }

      function quad(x0, x1, zn, zf, yn, yf, fill) {
        ctx.beginPath();
        ctx.moveTo(gx(x0, zf), yf);
        ctx.lineTo(gx(x1, zf), yf);
        ctx.lineTo(gx(x1, zn), yn);
        ctx.lineTo(gx(x0, zn), yn);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
      }

      // loose stone, and the leaves that blew onto it
      function stones() {
        const SG = 1.4;
        const bandZ = [3, 8, 16, 28, 46, 74], stoneL = [], stoneD = [], leaf = [];
        for (const bz of bandZ) {
          stoneL.push(shade([176, 168, 156], bz, 1));
          stoneD.push(shade([74, 66, 58], bz, 1));
          leaf.push(shade([150, 96, 54], bz, 1));
        }
        const bi = (z) => (z < 5 ? 0 : z < 11 ? 1 : z < 21 ? 2 : z < 36 ? 3 : z < 58 ? 4 : 5);
        for (let k = Math.ceil((camZ + 2) / SG); k * SG - camZ < 90; k++) {
          const z = k * SG - camZ;
          const s = F / z;
          if (s < 2) continue;
          if (gy(z) > topAt(z) + 1) continue;
          const b = bi(z), Z = k * SG;
          const road2 = paved(Z);
          for (let n = 0; n < 3; n++) {
            const q = hs(k * 3 + n, 501);
            const p = pj((q - 0.5) * (RH + SHD) * 2.1, 0, z);
            const on = Math.abs((q - 0.5) * 2.1 * (RH + SHD)) > RH;
            if (road2 && !on) continue;
            R(p.x, p.y, Math.max(1, s * 0.05), Math.max(1, s * 0.032),
              on ? leaf[b] : (hs(k * 3 + n, 502) < 0.5 ? stoneL[b] : stoneD[b]));
          }
          // dead leaves and stubble, so the ground either side isn't a painted plane
          for (let n = 0; n < 7; n++) {
            const xx = (hs(k * 8 + n, 511) - 0.5) * 34;
            if (Math.abs(xx) < RH + 0.4) continue;
            const p = pj(xx, 0, z + hs(k * 8 + n, 512) * SG);
            const q = hs(k * 8 + n, 513);
            R(p.x, p.y, Math.max(1, s * 0.09), Math.max(1, s * 0.03),
              q < 0.5 ? leaf[b] : q < 0.78 ? stoneD[b] : stoneL[b]);
          }
        }
      }

      /* ================= what grows beside it ================= */

      // a bare hardwood: a pale trunk and a scribble of branches. a forest of
      // them, standing close, is what this whole route looks like in february.
      function hardwood(x, z, k, ice) {
        const b = pj(x, 0, z), s = b.s;
        const hgt = (8 + hs(k, 21) * 10) * s;
        if (hgt < 2) return;
        lerp3([132, 120, 106], [238, 244, 249], ice * 0.75, tmp);
        const lit = shade([tmp[0], tmp[1], tmp[2]], z, 1);
        lerp3([70, 62, 55], [198, 210, 220], ice * 0.7, tmp);
        const drk = shade([tmp[0], tmp[1], tmp[2]], z, 1);
        const bx0 = Math.round(b.x), by0 = Math.round(b.y);

        if (hgt < 8) { R(bx0, by0 - hgt, 1, hgt, drk); return; }
        const w = Math.max(1, hgt * 0.016);
        const bend = (hs(k, 22) - 0.5) * hgt * 0.05;
        for (let n = 0; n < 3; n++) {
          const u = n / 3;
          R(bx0 + bend * u, by0 - hgt * (u + 0.34), Math.max(1, w * (1 - u * 0.5)), hgt * 0.35, n & 1 ? lit : drk);
        }
        // branches go up and out, never straight across
        ctx.save();
        ctx.lineWidth = 1;
        ctx.strokeStyle = drk;
        ctx.beginPath();
        for (let n = 0; n < 6; n++) {
          const q = hs(k * 7 + n, 24);
          const y0 = by0 - hgt * (0.44 + q * 0.44);
          const dir = n & 1 ? 1 : -1;
          const len = hgt * (0.08 + q * 0.13);
          const xs = bx0 + bend * 0.8;
          ctx.moveTo(xs, y0);
          ctx.lineTo(xs + dir * len, y0 - len * 1.15);
          if (q > 0.5) ctx.lineTo(xs + dir * len * 1.5, y0 - len * 2.1);
        }
        ctx.stroke();
        if (ice > 0.3) {
          ctx.strokeStyle = shade([240, 246, 250], z, 1);
          ctx.globalAlpha = ice;
          ctx.stroke();
        }
        ctx.restore();
      }

      // rhododendron: dark, waxy, and everywhere along the creeks
      function laurel(x, z, k) {
        const b = pj(x, 0, z), s = b.s;
        const w = (0.8 + hs(k, 31) * 1.1) * s, h = (0.7 + hs(k, 32) * 0.8) * s;
        if (w < 1.4) return;
        const c = shade([44, 60, 46], z, 1), l = shade([76, 100, 74], z, 1);
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.ellipse(Math.round(b.x), Math.round(b.y - h * 0.42), w * 0.5, h * 0.46, 0, 0, 6.283);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(Math.round(b.x - w * 0.22), Math.round(b.y - h * 0.7), w * 0.3, h * 0.34, 0, 0, 6.283);
        ctx.fill();
        R(b.x - w * 0.3, b.y - h * 0.82, Math.max(1, w * 0.26), Math.max(1, h * 0.2), l);
      }

      function pine(x, z, k, ice) {
        const b = pj(x, 0, z), s = b.s;
        const hgt = (10 + hs(k, 41) * 8) * s;
        if (hgt < 3) return;
        lerp3([42, 58, 44], [208, 222, 230], ice * 0.65, tmp);
        const c = shade([tmp[0], tmp[1], tmp[2]], z, 1);
        lerp3([66, 90, 64], [238, 244, 249], ice * 0.6, tmp);
        const l = shade([tmp[0], tmp[1], tmp[2]], z, 1);
        const wmax = hgt * 0.15;
        const bx0 = Math.round(b.x), by0 = Math.round(b.y);
        R(bx0, by0 - hgt * 0.22, Math.max(1, hgt * 0.025), hgt * 0.22, shade([54, 44, 38], z, 1));
        const rows = Math.max(5, Math.min(14, Math.round(hgt / 3.4)));
        for (let i = 0; i < rows; i++) {
          const u = i / rows;
          const w = Math.max(1, wmax * Math.pow(1 - u, 0.62));
          const y = by0 - hgt * (0.18 + u * 0.84);
          R(bx0 - w, y, w * 2, Math.max(1, hgt * 0.075), c);
          if (w > 1.5) R(bx0, y, Math.max(1, w * 0.6), Math.max(1, hgt * 0.05), l);
        }
      }

      function grasses(x, z, k, n) {
        const b = pj(x, 0, z), s = b.s;
        if (s < 7) return;
        const c = shade([190, 166, 122], z, 1), c2 = shade([132, 110, 76], z, 1);
        for (let i = 0; i < n; i++) {
          const zz = z + hs(k * 9 + i, 62) * SEG;
          if (zz < 1.6) continue;
          const p = pj(x + (hs(k * 9 + i, 61) - 0.5) * 5, 0, zz);
          const hgt = Math.max(1, (0.22 + hs(k * 9 + i, 63) * 0.36) * p.s);
          R(p.x, p.y - hgt, 1, hgt, i & 1 ? c : c2);
        }
      }

      /* ================= the things you remember ================= */

      function cabin(x, z, k) {
        const b = pj(x, 0, z), s = b.s;
        if (s < 1.2) return;
        const w = 7 * s, h = 3.1 * s;
        R(b.x - w / 2, b.y - h, w, h, shade([58, 48, 42], z, 1));
        R(b.x - w * 0.56, b.y - h - 1.1 * s, w * 1.12, 1.3 * s, shade([176, 182, 188], z, 1));
        if (PAL.lit < 0.66) R(b.x - w * 0.2, b.y - h * 0.62, Math.max(1, 0.7 * s), Math.max(1, 0.6 * s), "rgba(252,214,140,0.85)");
      }

      function barn(x, z, k) {
        const b = pj(x, 0, z), s = b.s;
        if (s < 1) return;
        const w = 11 * s, h = 4.6 * s;
        R(b.x - w / 2, b.y - h, w, h, shade([138, 62, 48], z, 1));
        R(b.x - w * 0.54, b.y - h - 2.2 * s, w * 1.08, 2.4 * s, shade([170, 76, 54], z, 1));
        R(b.x - w * 0.1, b.y - h * 0.72, Math.max(1, w * 0.2), h * 0.72, shade([30, 26, 24], z, 1));
      }

      // grassy mountain, and the tower you climbed to
      function firetower(x, z, k) {
        const b = pj(x, 0, z), s = b.s;
        if (s < 0.5) return;
        const h = 13 * s;
        const c = shade([70, 72, 80], z, 1);
        for (const o of [-1, 1]) {
          ctx.strokeStyle = c;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(Math.round(b.x + o * 2.1 * s) + 0.5, Math.round(b.y) + 0.5);
          ctx.lineTo(Math.round(b.x + o * 0.7 * s) + 0.5, Math.round(b.y - h) + 0.5);
          ctx.stroke();
        }
        for (let i = 1; i < 5; i++) {
          const u = i / 5, y = b.y - h * u, wid = (2.1 - 1.4 * u) * s;
          R(b.x - wid, y, wid * 2, 1, c);
        }
        R(b.x - 1.6 * s, b.y - h - 1.5 * s, 3.2 * s, 1.6 * s, shade([96, 98, 106], z, 1));
        R(b.x - 1.8 * s, b.y - h - 2.1 * s, 3.6 * s, Math.max(1, 0.7 * s), shade([132, 136, 144], z, 1));
      }

      function truck(x, z, k) {
        const b = pj(x, 0, z), s = b.s;
        if (s < 2) return;
        R(b.x - 2.4 * s, b.y - 1.5 * s, 4.8 * s, 1.1 * s, shade([96, 84, 66], z, 1));
        R(b.x - 0.6 * s, b.y - 2.3 * s, 2.2 * s, 0.9 * s, shade([110, 98, 78], z, 1));
        R(b.x - 2.1 * s, b.y - 0.5 * s, 0.7 * s, 0.6 * s, shade([32, 28, 26], z, 1));
        R(b.x + 1.3 * s, b.y - 0.5 * s, 0.7 * s, 0.6 * s, shade([32, 28, 26], z, 1));
      }

      function sign(x, z, k, brown) {
        const b = pj(x, 0, z), s = b.s;
        if (s < 3) return;
        R(b.x, b.y - 2 * s, 1, 2 * s, shade([90, 82, 74], z, 1));
        R(b.x - 0.8 * s, b.y - 2.7 * s, 1.7 * s, 0.9 * s, shade(brown ? [86, 62, 38] : [206, 206, 200], z, 1));
      }

      function roadside() {
        const i0 = Math.ceil((camZ + 1.6) / SEG), i1 = Math.floor((camZ + VIEW) / SEG);
        for (let i = i1; i >= i0; i--) {
          const z = i * SEG - camZ;
          const Z = i * SEG;
          const m = mileOf(Z);
          const ice = iceAt(Z);
          const clear = open(Z);
          if (gy(z) > topAt(z) + 1.5) continue;      // behind a rise

          for (let sd = -1; sd <= 1; sd += 2) {
            const seed = i * 2 + (sd > 0 ? 1 : 0);
            const edge = RH + SHD;
            // the forest crowds right up to the road, except where it opens out
            const dens = clear ? 0.06 : 0.92;
            // the further off a length of road is, the wider a band of woods you can
            // see beside it, so the spread has to open up with distance
            const spread = Math.min(120, 8 + z * 0.7);
            for (let n = 0; n < 5; n++) {
              if (hs(seed * 11 + n, 101 + n) > dens) continue;
              const q = hs(seed * 11 + n, 111 + n);
              const x = sd * (edge + 0.6 + q * q * spread);
              const zz = z + hs(seed * 11 + n, 121 + n) * SEG;
              if (creek(Z) && sd < 0 && Math.abs(x) < edge + 3.4) continue;
              const r = hs(seed * 11 + n, 131 + n);
              // the big conifers stand back off the road; up close it is all bare trunk
              if (r < 0.82 || Math.abs(x) < 15) hardwood(x, zz, seed * 11 + n, ice);
              else pine(x, zz, seed * 11 + n, ice);
            }
            if (!clear && hs(seed, 141) < 0.5) laurel(sd * (edge + 0.4 + hs(seed, 142) * 3), z, seed);
            if (z < 110) grasses(sd * (edge + 1.6), z, seed, 4);
          }

          if (between(28.8, 35.6) && hs(i, 171) < 0.045) barn((hs(i, 172) < 0.5 ? -1 : 1) * (26 + hs(i, 173) * 40), z, i);
        }
      }

      // the things there is exactly one of, each standing where the ride put it
      const PROPS = [
        [0.10, cabin, 13], [0.14, cabin, 17],
        [1.28, sign, 2.6], [10.22, sign, 2.6],
        [5.98, cabin, -11], [6.04, cabin, -15], [6.10, cabin, 13],
        [13.68, firetower, -13],
        [30.30, firetower, -120],
        [39.18, truck, 5.5],
        [39.40, cabin, -12], [39.46, cabin, 15],
      ];
      function props() {
        for (let n = PROPS.length - 1; n >= 0; n--) {
          const [m, fn, x] = PROPS[n];
          const z = (m / MILES) * ROUTE - camZ;
          if (z < 2 || z > VIEW) continue;
          if (gy(z) > topAt(z) + 2) continue;
          fn(x, z, n * 31 + 7, 1);
        }
      }

      /* ================= riders ================= */

      function limb(ax, ay, bx, by, w1, w2, fill) {
        const dx2 = bx - ax, dy2 = by - ay;
        const d = Math.hypot(dx2, dy2) || 1e-4;
        const nx = -dy2 / d, ny = dx2 / d;
        ctx.beginPath();
        ctx.moveTo(ax + nx * w1, ay + ny * w1);
        ctx.lineTo(bx + nx * w2, by + ny * w2);
        ctx.lineTo(bx - nx * w2, by - ny * w2);
        ctx.lineTo(ax - nx * w1, ay - ny * w1);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
      }

      function wheel(cx, cy, r, ps, spin, col) {
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(1 / ps, 0.05);
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(1.5 / ps, 0.08), r, 0, 0, 6.283);
        ctx.stroke();
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = Math.max(0.7 / ps, 0.016);
        for (let i = 0; i < 4; i++) {
          const a = spin + i * 1.5708;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.sin(a) * 0.05, cy - Math.cos(a) * r * 0.92);
          ctx.stroke();
        }
        ctx.restore();
      }

      // o: { dz, x, lean, crank, stop, steer, jersey, helmet, bike, shadow }
      function figure(o) {
        const rear = pj(o.x, 0, o.dz), front = pj(o.x, 0, o.dz + (DZF - DZR));
        const s = rear.s, k = front.s / s;
        if (s < 4) return;
        const dy = (front.y - rear.y) / s;
        const bob = Math.sin(o.crank * 2) * 0.014 + Math.sin(o.crank) * 0.005;

        const dark = shade([26, 26, 32], o.dz, 1);
        const far2 = shade([46, 46, 54], o.dz, 1);
        const metal = shade([120, 118, 126], o.dz, 1);
        const cloth = shade(o.jersey, o.dz, 1);
        const pack = shade([34, 34, 40], o.dz, 1);
        const skin = shade([196, 156, 122], o.dz, 1);
        const bike = shade(o.bike, o.dz, 1);

        if (o.shadow) {
          ctx.save();
          ctx.globalAlpha = 0.16 + 0.26 * PAL.lit;
          ctx.fillStyle = "rgb(28,24,22)";
          ctx.beginPath();
          ctx.ellipse(Math.round(rear.x), Math.round(rear.y), 0.42 * s, Math.max(1, 0.1 * s), 0, 0, 6.283);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(Math.round(front.x), Math.round(front.y), 0.3 * front.s, Math.max(1, 0.075 * front.s), 0, 0, 6.283);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(Math.round(rear.x), Math.round(rear.y));
        ctx.rotate(o.lean);
        ctx.scale(s, s);
        ctx.translate(0, -bob);

        const weave = Math.sin(t * 0.9 + o.dz) * 0.085 + o.steer * 0.09;
        ctx.save();
        ctx.translate(weave, dy);
        ctx.scale(k, k);
        const px2 = 1 / (s * k);
        const turn = o.steer * 0.5 + Math.sin(t * 0.9 + o.dz) * 0.32;
        ctx.strokeStyle = far2;
        ctx.lineWidth = Math.max(px2, 0.05);
        ctx.beginPath();
        ctx.ellipse(0, -0.34, Math.max(1.6 * px2, 0.08 + Math.abs(Math.sin(turn)) * 0.34), 0.34, 0, 0, 6.283);
        ctx.stroke();
        ctx.strokeStyle = bike;
        ctx.lineWidth = Math.max(px2, 0.04);
        ctx.beginPath();
        for (const d of [-1, 1]) { ctx.moveTo(d * 0.062, -0.34); ctx.lineTo(d * 0.03, -0.8); }
        ctx.moveTo(0, -0.8);
        ctx.lineTo(0, -1.0);
        ctx.stroke();
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(px2, 0.055);
        ctx.beginPath();
        ctx.moveTo(-0.32, -1.0);
        ctx.lineTo(0.32, -1.0);
        ctx.stroke();
        ctx.fillStyle = dark;
        for (const d of [-1, 1]) ctx.fillRect(d * 0.32 - 0.05, -1.035, 0.1, 0.07);
        ctx.restore();

        wheel(0, -0.34, 0.34, s, -o.crank * 1.6, dark);

        const hipY = -0.93, bbY = -0.27, cr = 0.17, pw = 0.10;
        ctx.strokeStyle = bike;
        ctx.lineWidth = Math.max(1 / s, 0.05);
        ctx.beginPath();
        ctx.moveTo(0, -0.34);
        ctx.lineTo(0, -0.9);
        ctx.stroke();
        ctx.lineWidth = Math.max(0.8 / s, 0.03);
        ctx.beginPath();
        for (const d of [-1, 1]) {
          ctx.moveTo(0, -0.86);
          ctx.lineTo(d * 0.055, -0.36);
          ctx.moveTo(0, -0.34);
          ctx.lineTo(d * 0.05, bbY);
        }
        ctx.stroke();
        ctx.fillStyle = dark;
        ctx.beginPath();
        ctx.ellipse(0, -0.94, 0.085, 0.032, 0, 0, 6.283);
        ctx.fill();
        ctx.strokeStyle = metal;
        ctx.lineWidth = Math.max(0.7 / s, 0.024);
        ctx.beginPath();
        ctx.ellipse(0.05, bbY, 0.03, 0.1, 0, 0, 6.283);
        ctx.stroke();

        for (const d of [-1, 1]) {
          const a = o.crank + (d < 0 ? 0 : Math.PI);
          let fx = d * pw, fy = bbY + Math.cos(a) * cr;
          if (o.stop > 0.01 && d < 0) {
            fx += (-0.34 - fx) * o.stop;
            fy += (0 - fy) * o.stop;
          }
          ctx.strokeStyle = metal;
          ctx.lineWidth = Math.max(0.8 / s, 0.026);
          ctx.beginPath();
          ctx.moveTo(d * 0.06, bbY);
          ctx.lineTo(fx, fy);
          ctx.stroke();

          const hx2 = d * 0.075;
          const vx = fx - hx2, vy = fy - hipY;
          const dd = Math.max(0.05, Math.min(0.83, Math.hypot(vx, vy)));
          const h = Math.sqrt(Math.max(0, 0.1764 - dd * dd / 4)) * 0.16;
          let nx = -vy / dd, ny = vx / dd;
          if (nx * d < 0) { nx = -nx; ny = -ny; }
          const kx = hx2 + vx * 0.5 + nx * h, ky = hipY + vy * 0.5 + ny * h;
          limb(hx2, hipY, kx, ky, 0.08, 0.058, dark);
          limb(kx, ky, fx, fy, 0.058, 0.038, dark);
          ctx.fillStyle = dark;
          ctx.fillRect(fx - 0.055, fy - 0.028, 0.11, 0.056);
        }

        const shY = -1.4;
        limb(0, hipY - 0.02, 0, shY, 0.15, 0.19, cloth);
        ctx.fillStyle = cloth;
        ctx.beginPath();
        ctx.ellipse(0, shY + 0.03, 0.19, 0.085, 0, 0, 6.283);
        ctx.fill();
        // the pack everyone was wearing
        ctx.fillStyle = pack;
        ctx.fillRect(-0.115, shY + 0.02, 0.23, 0.3);
        ctx.fillRect(-0.075, shY - 0.04, 0.15, 0.08);

        const hyb = dy - 1.02 * k;
        for (const d of [-1, 1]) {
          const hx3 = weave + d * 0.31 * k;
          const ex = (d * 0.19 + hx3 * 1.35) * 0.5, ey = (shY + hyb) * 0.5 + 0.05;
          limb(d * 0.17, shY + 0.04, ex, ey, 0.052, 0.042, cloth);
          limb(ex, ey, hx3, hyb, 0.042, 0.032, cloth);
        }

        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(0, -1.53, 0.098, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = shade(o.helmet, o.dz, 1);
        ctx.beginPath();
        ctx.arc(0, -1.56, 0.113, Math.PI * 1.04, Math.PI * 1.96);
        ctx.fill();

        ctx.strokeStyle = "rgba(252,248,240," + (0.08 + 0.26 * PAL.lit).toFixed(3) + ")";
        ctx.lineWidth = 0.02;
        ctx.beginPath();
        ctx.moveTo(-0.18, shY + 0.07);
        ctx.lineTo(-0.14, hipY - 0.03);
        ctx.stroke();
        ctx.restore();
      }

      /* ================= riding ================= */

      function step(dt) {
        const fwd = keys.has("w") || keys.has("arrowup");
        const back = keys.has("s") || keys.has("arrowdown");
        const lft = keys.has("a") || keys.has("arrowleft");
        const rgt = keys.has("d") || keys.has("arrowright");
        if (fwd || back || lft || rgt) hint = Math.max(0, hint - dt * 1.4);

        grade = (elev(camZ + 3) - elev(camZ - 3)) / 6;

        if (fwd) spd += 4.8 * dt;
        if (back) spd -= 7 * dt;
        // the hill, which is the whole point of this route. it should cost you most
        // of your speed on the steep bits and none of it on the way back down, but
        // it must never win outright while he is still pedalling.
        const holding = !fwd && !back && Math.abs(spd) < 0.5;
        if (!holding) spd -= grade * 38 * dt;
        spd -= spd * (0.12 + Math.abs(spd) * 0.02) * dt;
        if (holding) spd -= spd * Math.min(1, dt * 5);
        spd = Math.max(-1.6, Math.min(20, spd));
        if (Math.abs(spd) < 0.03 && !fwd && !back) spd = 0;

        const ax = Math.abs(riderX);
        const want = (rgt ? 1 : 0) - (lft ? 1 : 0);
        steer += (want - steer) * Math.min(1, dt * 5);
        let push = steer;
        if (push * riderX > 0) push *= Math.max(0, Math.min(1, (LANE - ax) / 0.5));
        riderX += push * dt * (2.2 + Math.min(6, Math.abs(spd)) * 0.4);
        riderX = Math.max(-LANE, Math.min(LANE, riderX));

        still = Math.abs(spd) < 0.5 ? Math.min(1, still + dt * 0.5) : Math.max(0, still - dt * 1.6);
        stop += ((Math.abs(spd) < 0.35 && still > 0.55 ? 1 : 0) - stop) * Math.min(1, dt * 3);

        const tilt = push * 0.17 * Math.min(1, Math.abs(spd) / 6) + Math.sin(t * 1.5) * 0.012 * (1 - Math.min(1, Math.abs(spd) / 4)) - stop * 0.12;
        lean += (tilt - lean) * Math.min(1, dt * 6);

        camX += (riderX - camX) * Math.min(1, dt * 3.4);
        const was = camZ;
        camZ = Math.max(-40, camZ + spd * dt);
        camY = elev(camZ) + CAMH;
        dist += Math.abs(spd) * dt;
        if (camZ > was) gain += Math.max(0, feetZ(camZ) - feetZ(was)) * GAINK;
        // out of the saddle when it is steep, spinning when it is not
        crank += Math.sign(spd) * Math.min(8.6, Math.abs(spd) * 1.15) * dt * (1 - stop);
        wind = 0.5 + 0.5 * Math.sin(t * 0.31);

        // he is up the road somewhere, taking his turn on the front
        buddy += (Math.sin(t * 0.13) * 26 + 46 - buddy) * Math.min(1, dt * 0.25);

        while (markI < MARKS.length && mile >= MARKS[markI][0]) {
          markLines = MARKS[markI][1];
          markT = 0;
          markI++;
        }
        markT += dt;
      }

      function hud() {
        const pale = "rgb(236,240,244)";
        if (hint > 0.01) say("w a s d", W / 2, H - 13, pale, hint * 0.55);
        const rest = dist > 40 ? Math.max(0, Math.min(1, (still - 0.6) * 2.2)) : 0;
        if (rest > 0.01) say("you can stop anywhere on this route", W / 2, H - 13, pale, rest * 0.4);

        // the last one is an arrival, not a sign you ride past, so it stays up
        const dur = markI >= MARKS.length ? 1e9 : 7.5;
        if (markLines && markT < dur) {
          const a = Math.min(1, markT / 0.8) * Math.min(1, (dur - markT) / 1.2);
          for (let i = 0; i < markLines.length; i++) {
            say(markLines[i], W / 2, Math.round(H * 0.72) + i * 7, pale, a * 0.85);
          }
        }
        say(Math.min(MILES, mile).toFixed(1) + " mi", 24, H - 8, pale, 0.34);
        say(Math.round(gain) + " ft", W - 26, H - 8, pale, 0.34);
        // what the road is doing to you: a bit of road, tilted the way the road is
        ctx.save();
        ctx.translate(W / 2, H - 6);
        ctx.rotate(-Math.atan(grade * 4));
        ctx.strokeStyle = "rgba(236,240,244,0.42)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-7, 0.5);
        ctx.lineTo(7, 0.5);
        ctx.stroke();
        ctx.restore();
      }

      function frame(now) {
        const raw = now - last;
        const dt = Math.min(0.05, raw / 1000 || 0.016);
        last = now;
        t += dt;
        ms += (Math.min(90, raw) - ms) * 0.05;
        if (++frames === 150 && ms > 30 && !LOW) { LOW = true; resize(); }

        light();
        step(dt);
        light();

        sky();
        ridges();
        road();
        forest();
        stones();
        roadside();
        props();

        figure({
          dz: DZR + buddy, x: Math.sin(t * 0.31) * 0.8, lean: Math.sin(t * 0.7) * 0.05,
          crank: crank * 0.92 + 1.7, stop: 0, steer: Math.sin(t * 0.5) * 0.2,
          jersey: [216, 224, 74], helmet: [224, 122, 30], bike: [200, 90, 24], shadow: 0,
        });
        figure({
          dz: DZR, x: riderX, lean: lean, crank: crank, stop: stop, steer: steer,
          jersey: [216, 224, 74], helmet: [30, 30, 36], bike: [224, 122, 30], shadow: 1,
        });

        const vg = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.36, W / 2, H * 0.48, Math.max(W, H) * 0.76);
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(18,16,20," + (0.34 + dusk * 0.3).toFixed(2) + ")");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);

        hud();
        crush();

        dx.imageSmoothingEnabled = false;
        dx.drawImage(buf, 0, 0, W, H, 0, 0, W * PIX, H * PIX);
        requestAnimationFrame(frame);
      }

      /* ================= setup ================= */

      function resize() {
        DW = window.innerWidth;
        DH = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        PIX = Math.max(2, Math.round((DH * dpr) / (LOW ? 150 : 208)));
        W = Math.ceil((DW * dpr) / PIX);
        H = Math.ceil((DH * dpr) / PIX);
        out.width = W * PIX;
        out.height = H * PIX;
        buf.width = W;
        buf.height = H;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.imageSmoothingEnabled = false;
        F = H * 1.12;
        horizon = Math.round(H * 0.46);
      }

      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
        keys.add(k);
      });
      addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
      addEventListener("blur", () => keys.clear());

      let touch = null;
      addEventListener("touchstart", (e) => {
        const p = e.touches[0];
        touch = { x0: p.clientX };
        keys.add(p.clientX > DW / 2 ? "w" : "s");
      }, { passive: true });
      addEventListener("touchmove", (e) => {
        e.preventDefault();
        if (!touch) return;
        const d = e.touches[0].clientX - touch.x0;
        keys.delete("a");
        keys.delete("d");
        if (d > 24) keys.add("d");
        else if (d < -24) keys.add("a");
      }, { passive: false });
      addEventListener("touchend", () => { touch = null; keys.clear(); }, { passive: true });

      let rt;
      addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 140); });

      buildLUT();
      buildProfile();
      calibrate();
      camY = elev(0) + CAMH;
      resize();
      requestAnimationFrame((n) => { last = n; frame(n); });
    </script>
  </body>
</html>
