<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>blorb</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: monospace;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #ui {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10;
      }

      #dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25),
          0 0 18px rgba(255, 255, 255, 0.12);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        animation: spin 9s linear infinite;
      }

      #dot:hover {
        transform: scale(1.25);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5),
          0 0 26px rgba(255, 255, 255, 0.25);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* right edge is pinned, so extra columns grow leftward into the window */
      #pal {
        position: absolute;
        right: 0;
        bottom: 38px;
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(8, auto);
        gap: 6px;
        padding: 3px;
        max-height: calc(100vh - 70px);
        overflow: auto;
        scrollbar-width: none;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px) scale(0.94);
        transform-origin: 100% 100%;
        transition: opacity 0.22s ease, transform 0.22s ease;
      }

      #pal::-webkit-scrollbar {
        display: none;
      }

      #pal.open {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .row {
        display: flex;
        flex: 0 0 auto;
        width: 104px;
        height: 18px;
        border-radius: 999px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .row:hover {
        transform: scale(1.08);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55);
      }

      .row.on {
        box-shadow: 0 0 0 1px #fff, 0 0 14px rgba(255, 255, 255, 0.35);
      }

      .row span {
        flex: 1;
      }

      /* narrow windows: shrink the swatches rather than clip the columns */
      @media (max-width: 640px) {
        .row {
          width: 74px;
        }
      }

      @media (max-width: 460px) {
        .row {
          width: 52px;
        }
      }

      @media (max-height: 300px) {
        #pal {
          grid-template-rows: repeat(5, auto);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="ui">
      <div id="pal"></div>
      <div id="dot"></div>
    </div>

    <script>
      // wheels downward from neon into the murk
      var PALETTES = [
        ["#00f5d4", "#00bbf9", "#9b5de5", "#f15bb5"],
        ["#ff71ce", "#01cdfe", "#05ffa1", "#b967ff"],
        ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec"],
        ["#06ffa5", "#4cc9f0", "#b5179e", "#f72585"],
        ["#2d00f7", "#8900f2", "#cc00ff", "#ff0099"],
        ["#f72585", "#7209b7", "#3a0ca3", "#4361ee"],
        ["#ccff33", "#9ef01a", "#38b000", "#007f5f"],
        ["#ffd60a", "#ffc300", "#ff8500", "#ff5400"],
        ["#ff9e00", "#ff5400", "#ff0054", "#390099"],
        ["#f9ed69", "#f08a5d", "#b83b5e", "#6a2c70"],
        ["#e0aaff", "#c77dff", "#9d4edd", "#7b2cbf"],
        ["#caf0f8", "#48cae4", "#0077b6", "#023e8a"],
        ["#00ffff", "#00b4d8", "#0353a4", "#001845"],
        ["#d8f3dc", "#95d5b2", "#52b788", "#2d6a4f"],
        ["#fff3b0", "#e09f3e", "#9e2a2b", "#540b0e"],
        ["#ff4d6d", "#c9184a", "#800f2f", "#590d22"],
        ["#84a98c", "#52796f", "#354f52", "#2f3e46"],
        ["#adc178", "#a98467", "#6c584c", "#3b3a30"],
        ["#a5a58d", "#6b705c", "#3f4238", "#252620"],
        ["#98c1d9", "#3d5a80", "#293241", "#12161f"],
        ["#8d99ae", "#5c677d", "#2b2d42", "#161a26"],
        ["#778da9", "#415a77", "#1b263b", "#0d1b2a"],
        ["#9db17c", "#5c7a4a", "#33472e", "#16211a"],
        ["#8a9a5b", "#4a5240", "#2b2e22", "#12140e"],
        ["#bc6c25", "#606c38", "#283618", "#1a1005"],
        ["#b08968", "#7f5539", "#463f3a", "#231c1a"],
        ["#9a8c98", "#4a4e69", "#22223b", "#0f0f18"],
        ["#7f5539", "#582f0e", "#3a2618", "#180f08"],
        ["#38b000", "#006400", "#1f2416", "#0a0a0a"],
        ["#6d8b74", "#5f7161", "#3c4a3e", "#141a15"],
        ["#5a189a", "#3c096c", "#240046", "#10002b"],
        ["#4a4238", "#2d2a26", "#1a1714", "#0b0a09"],
      ];

      var canvas = document.getElementById("c");
      var gl =
        canvas.getContext("webgl", { antialias: false, alpha: false }) ||
        canvas.getContext("experimental-webgl");

      if (!gl) {
        document.body.innerHTML =
          '<div style="color:#666;font:14px monospace;padding:20px">no webgl. sorry.</div>';
        throw new Error("no webgl");
      }

      var VERT = [
        "attribute vec2 a;",
        "void main(){ gl_Position = vec4(a,0.0,1.0); }",
      ].join("\n");

      var FRAG = [
        "precision highp float;",
        "uniform vec2 u_res;",
        "uniform float u_time;",
        "uniform vec2 u_par;",
        "uniform vec3 u_c0,u_c1,u_c2,u_c3;",
        // xy = center px, z = rotX, w = rotY
        "uniform vec4 u_a0,u_a1,u_a2,u_a3;",
        // x = radius, y = jiggle amp, z = jiggle phase, w = wiggle amp
        "uniform vec4 u_b0,u_b1,u_b2,u_b3;",

        "vec3 palPick(float i){",
        "  i = mod(floor(i + 0.5), 4.0);",
        "  if(i < 0.5) return u_c0;",
        "  if(i < 1.5) return u_c1;",
        "  if(i < 2.5) return u_c2;",
        "  return u_c3;",
        "}",

        // cyclic 4-stop gradient, starting at slot `off`
        "vec3 palAt(float x, float off){",
        "  float t = fract(x) * 4.0;",
        "  float i0 = floor(t);",
        "  float f = fract(t);",
        "  f = f*f*(3.0-2.0*f);",
        "  return mix(palPick(i0+off), palPick(i0+1.0+off), f);",
        "}",

        "vec3 rot3(vec3 p, float ax, float ay){",
        "  float c1 = cos(ax), s1 = sin(ax);",
        "  p.yz = vec2(p.y*c1 - p.z*s1, p.y*s1 + p.z*c1);",
        "  float c2 = cos(ay), s2 = sin(ay);",
        "  p.xz = vec2(p.x*c2 + p.z*s2, -p.x*s2 + p.z*c2);",
        "  return p;",
        "}",

        // kaleidoscopic fold — the trippy bit
        "float kali(vec3 p){",
        "  float acc = 0.0;",
        "  for(int i = 0; i < 4; i++){",
        "    p = abs(p);",
        "    p = p / (dot(p,p) + 0.002) - vec3(0.84, 0.79, 0.92);",
        "    acc += length(p);",
        "  }",
        "  return acc;",
        "}",

        "float hash21(vec2 p){",
        "  p = fract(p * vec2(127.31, 311.7));",
        "  p += dot(p, p + 34.23);",
        "  return fract(p.x * p.y);",
        "}",

        // two sparse layers of pixel-sized stars. the falloff is measured in pixels so
        // they stay pin-sharp at any resolution, and centres are kept off the cell
        // edges so none of them get clipped in half.
        "vec3 stars(vec2 uv){",
        "  vec3 acc = vec3(0.0);",
        "  for(int i = 0; i < 2; i++){",
        "    float dens = 44.0 + 34.0*float(i);",
        "    vec2 sp = uv * dens;",
        "    vec2 cell = floor(sp);",
        "    float h = hash21(cell + 131.0*float(i) + 5.0);",
        "    if(h > 0.88 + 0.05*float(i)){",
        "      float h2 = hash21(cell + 61.0*float(i) + 17.0);",
        "      float h3 = hash21(cell + 29.0*float(i) + 43.0);",
        "      float d = length(fract(sp) - (0.25 + 0.5*vec2(h2, h3))) * (u_res.y / dens);",
        "      float tw = 0.58 + 0.42*sin(u_time*(0.7 + 2.0*h2) + h3*6.283);",
        "      vec3 c = mix(vec3(1.0), palAt(h3 + u_time*0.02, 0.0), 0.5);",
        // gaussian, not smoothstep: pixel centres land ~0.7px off a star at best, and
        // a linear ramp has already faded to nothing by there
        "      acc += c * exp(-d*d*0.85) * tw * (0.45 + 0.5*h2);",
        "    }",
        "  }",
        "  return acc;",
        "}",

        // spheres behind the scene. each octave is the previous one at half scale and
        // turned 37 degrees, so the field is self-similar however far down you look.
        // the first octave to contain the pixel wins, which puts the big ones in front
        // and lets the small ones fill the gaps between them.
        // returns the ball premultiplied, plus its coverage, so the stars behind it
        // can be masked out rather than shining straight through
        "vec4 gasket(vec2 uv, vec3 L, float px){",
        "  float a = u_time * 0.028;",
        "  uv = mat2(cos(a), -sin(a), sin(a), cos(a)) * uv;",
        "  uv += vec2(0.16*sin(u_time*0.047), 0.13*cos(u_time*0.039));",

        "  float s = 0.30 + 0.03*sin(u_time*0.061);",
        "  vec2 p = uv;",
        "  for(int i = 0; i < 5; i++){",
        "    vec2 g = p / s;",
        "    vec2 cell = floor(g);",
        "    float h = hash21(cell + 19.7*float(i));",
        "    float h2 = hash21(cell + 3.1 + 41.0*float(i));",
        "    float h3 = hash21(cell + 7.3 + 63.0*float(i));",
        // only some of them are awake, and they only ever drift inside their own cell
        "    float mv = step(0.55, h3);",
        "    float ph = h3 * 6.283;",
        "    vec2 bob = mv * 0.055 * vec2(",
        "      sin(u_time*(0.35 + 0.5*h) + ph),",
        "      cos(u_time*(0.29 + 0.4*h2) + ph*1.7)",
        "    );",
        // jitter the centres so it reads as a packing rather than a grid
        "    vec2 f = fract(g) - 0.5 - (vec2(h, h2) - 0.5) * 0.34 - bob;",
        "    float r = 0.26 + 0.13*h;",
        "    float ln = length(f);",
        "    if(h > 0.46 && ln < r){",
        "      float t = clamp(ln / r, 0.0, 1.0);",
        // rim-relative position gives a real unit normal, no derivatives needed
        "      vec3 n = vec3(f / max(ln, 1e-4) * t, sqrt(max(1.0 - t*t, 0.0)));",
        "      float w = max(px / s, 1e-5) * 1.5;",
        "      float mask = 1.0 - smoothstep(r - w, r, ln);",
        // anything near pixel-sized is shimmer, not detail — drop it
        "      float fade = smoothstep(px * 1.5, px * 7.0, r * s);",

        // one of the four gradients, same as the big ones use
        "      float idx = floor(h * 4.0);",
        "      vec3 base = palAt(idx*0.25 + h*0.3 + u_time*0.02, idx);",
        // the same kali texture as the foreground, but only where the ball is big
        // enough to hold the detail — on small ones it would just boil
        "      float soft = smoothstep(px*5.0, px*26.0, r * s);",
        "      vec3 tex = base;",
        "      if(soft > 0.001){",
        "        float spin = mv * (0.25 + 0.55*h2);",
        "        vec3 o = rot3(n, u_time*spin*0.6 + ph, u_time*spin + ph*0.5);",
        "        float v = kali(o * 1.15 + 0.12*sin(u_time*0.11 + idx));",
        "        v = v*0.115 + o.y*0.34 + 0.22*sin(o.x*2.3 + u_time*0.25);",
        "        float kk = v + u_time*0.035 + idx*0.19 + h*0.4;",
        "        vec3 t2 = vec3(palAt(kk, idx).r, palAt(kk + 0.014, idx).g, palAt(kk + 0.028, idx).b);",
        "        tex = mix(base, t2, soft);",
        "      }",

        "      float diff = 0.32 + 0.68 * max(dot(n, L), 0.0);",
        "      float spec = pow(max(reflect(-L, n).z, 0.0), 24.0);",
        "      float rim = pow(1.0 - n.z, 3.0);",
        // smaller reads as further away, so haze it back
        "      float depth = 1.0 - float(i)/4.0;",
        "      vec3 sc = tex*diff + vec3(spec*0.35) + tex*rim*0.5;",
        "      float cov = mask * fade;",
        "      return vec4(sc * mix(0.09, 0.34, depth) * cov, cov);",
        "    }",
        "    s *= 0.5;",
        "    p = mat2(0.8, -0.6, 0.6, 0.8) * p;",
        "  }",
        "  return vec4(0.0);",
        "}",

        "vec3 blob(vec3 col, vec2 p, vec4 A, vec4 B, float idx){",
        "  vec2 d = p - A.xy;",
        "  float len = length(d);",
        "  if(len > B.x * 1.8) return col;",

        "  float ang = atan(d.y, d.x);",
        // both wobbles are biased inward (the -0.18 / -0.075) so a sphere can only
        // bulge a little past its radius — that headroom is what keeps them apart
        // heavy jelly jiggle from a click: lobes sum to 0.20, so peak bulge is 0.05
        "  float w = B.y;",
        "  float bump = w * (0.13*sin(4.0*ang + B.z) + 0.07*sin(7.0*ang - 1.6*B.z) - 0.15);",
        // light ripple riding on how fast the mouse is moving: peak bulge 0.032
        "  float g = B.w;",
        "  float ts = u_time * 6.5 + idx * 1.7;",
        "  bump += g * (0.055*sin(3.0*ang + ts) + 0.032*sin(6.0*ang - ts*0.77) + 0.02*sin(ts*1.6) - 0.075);",
        "  float rr = B.x * (1.0 + bump);",

        "  float mask = 1.0 - smoothstep(rr - 1.5, rr + 0.5, len);",
        "  float z = sqrt(max(rr*rr - len*len, 0.0));",
        "  vec3 n = normalize(vec3(d, z));",

        "  vec3 o = rot3(n, A.z, A.w);",
        "  float v = kali(o * 1.15 + 0.12*sin(u_time*0.11 + idx));",
        "  v = v*0.115 + o.y*0.34 + 0.22*sin(o.x*2.3 + u_time*0.25);",
        "  float k = v + u_time*0.035 + idx*0.19;",

        // per-channel offset = soft rainbow fringe
        "  vec3 tex = vec3(palAt(k, idx).r, palAt(k + 0.014, idx).g, palAt(k + 0.028, idx).b);",

        "  vec3 L = normalize(vec3(-0.35, 0.45, 0.82));",
        "  float diff = 0.42 + 0.58 * max(dot(n, L), 0.0);",
        "  float spec = pow(max(reflect(-L, n).z, 0.0), 42.0);",
        "  float rim = pow(1.0 - n.z, 3.2);",
        "  vec3 surf = tex * diff + vec3(spec * 0.55) + tex * rim * 1.1;",

        // outside the edge the texture is angle-only, so its detail would smear into
        // straight rays — fade it to a flat tint as the halo falls off
        "  float glow = exp(-max(len - B.x, 0.0) / (B.x * 0.2));",
        "  float fade = clamp((len - B.x) / (B.x * 0.22), 0.0, 1.0);",
        "  vec3 gcol = mix(tex, palAt(u_time*0.03 + idx*0.3, idx), fade*fade);",
        "  col += gcol * glow * 0.5 * (1.0 - mask);",
        "  return mix(col, surf, mask);",
        "}",

        "void main(){",
        "  vec2 p = gl_FragCoord.xy;",
        "  vec2 q = (p - 0.5*u_res) / u_res.y;",

        "  float bv = sin(q.x*3.1 + u_time*0.19) + sin(q.y*2.7 - u_time*0.16) + sin(length(q)*5.5 - u_time*0.28);",
        "  vec3 col = vec3(0.014, 0.013, 0.028) + palAt(bv*0.07 + u_time*0.01, 0.0) * 0.05;",

        // the fractal sits behind everything, drifting against the mouse. the stars
        // are further still, so they shift less.
        "  vec3 L = normalize(vec3(-0.35, 0.45, 0.82));",
        "  vec4 g = gasket(q + u_par, L, 1.0 / u_res.y);",
        "  col += stars(q + u_par*0.35) * (1.0 - g.a);",
        "  col += g.rgb;",

        "  col = blob(col, p, u_a0, u_b0, 0.0);",
        "  col = blob(col, p, u_a1, u_b1, 1.0);",
        "  col = blob(col, p, u_a2, u_b2, 2.0);",
        "  col = blob(col, p, u_a3, u_b3, 3.0);",

        "  col *= 1.0 - 0.45 * pow(length(q) * 0.72, 2.2);",
        "  col += (fract(sin(dot(p, vec2(12.9898, 78.233)) + u_time) * 43758.5453) - 0.5) * 0.022;",
        "  gl_FragColor = vec4(col, 1.0);",
        "}",
      ].join("\n");

      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          console.error(gl.getShaderInfoLog(s));
        return s;
      }

      var prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 3, -1, -1, 3]),
        gl.STATIC_DRAW
      );
      var loc = gl.getAttribLocation(prog, "a");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      var U = {};
      ["u_res", "u_time", "u_par", "u_c0", "u_c1", "u_c2", "u_c3"].forEach(function (n) {
        U[n] = gl.getUniformLocation(prog, n);
      });
      for (var i = 0; i < 4; i++) {
        U["a" + i] = gl.getUniformLocation(prog, "u_a" + i);
        U["b" + i] = gl.getUniformLocation(prog, "u_b" + i);
      }

      // --- spheres: top, right, bottom, left. half of each hangs off screen.
      var spheres = [
        { spin: 1.0, drift: 0.09, amp: 0, t0: -99 },
        { spin: -0.82, drift: -0.13, amp: 0, t0: -99 },
        { spin: 0.91, drift: 0.16, amp: 0, t0: -99 },
        { spin: -1.12, drift: -0.07, amp: 0, t0: -99 },
      ];
      spheres.forEach(function (s, i) {
        s.rx = 0;
        s.ry = 0;
        s.tx = 0;
        s.ty = 0;
        s.wig = [1.0, 0.78, 1.15, 0.88][i];
      });

      var W = 0,
        H = 0,
        R = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        W = Math.round(innerWidth * dpr);
        H = Math.round(innerHeight * dpr);
        canvas.width = W;
        canvas.height = H;
        gl.viewport(0, 0, W, H);

        // close enough to kiss, never touching: the tightest pair sets the size.
        // at 0.45 each one can swell by (1-2f)/2f = 11% of its radius before contact,
        // which is more than the wobbles above can ever reach.
        var diag = Math.sqrt((W / 2) * (W / 2) + (H / 2) * (H / 2));
        R = 0.45 * Math.min(W, H, diag);

        spheres[0].cx = W / 2;
        spheres[0].cy = H; // top (gl y is up)
        spheres[1].cx = W;
        spheres[1].cy = H / 2; // right
        spheres[2].cx = W / 2;
        spheres[2].cy = 0; // bottom
        spheres[3].cx = 0;
        spheres[3].cy = H / 2; // left
      }
      addEventListener("resize", resize);
      resize();

      // --- palette, eased between picks
      function hex(h) {
        return [
          parseInt(h.slice(1, 3), 16) / 255,
          parseInt(h.slice(3, 5), 16) / 255,
          parseInt(h.slice(5, 7), 16) / 255,
        ];
      }

      var current = PALETTES[0].map(hex);
      var target = PALETTES[0].map(hex);
      var active = 0;

      function setPalette(i) {
        active = i;
        target = PALETTES[i].map(hex);
        dot.style.background =
          "conic-gradient(" +
          PALETTES[i]
            .map(function (c, j) {
              return c + " " + j * 25 + "% " + (j + 1) * 25 + "%";
            })
            .join(",") +
          ")";
        [].forEach.call(pal.children, function (el, j) {
          el.className = "row" + (j === i ? " on" : "");
        });
        if (pal.classList.contains("open"))
          pal.children[i].scrollIntoView({ block: "nearest" });
      }

      // wheel walks the list, either way, wrapping at both ends
      var acc = 0;
      addEventListener(
        "wheel",
        function (e) {
          e.preventDefault();
          // lines and pages into something notch-sized
          acc += e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 300 : 1);
          var step = 0;
          while (acc >= 100) {
            acc -= 100;
            step++;
          }
          while (acc <= -100) {
            acc += 100;
            step--;
          }
          step = Math.max(-3, Math.min(3, step));
          if (step)
            setPalette(
              ((active + step) % PALETTES.length + PALETTES.length) %
                PALETTES.length
            );
        },
        { passive: false }
      );

      // --- mouse spins them and shakes them, clicks make them wobble
      var mx = 0,
        my = 0,
        pmx = 0,
        pmy = 0,
        wig = 0,
        parx = 0,
        pary = 0,
        cursor = [0, 0];

      addEventListener("pointermove", function (e) {
        mx = (e.clientX / innerWidth) * 2 - 1;
        my = (e.clientY / innerHeight) * 2 - 1;
        cursor = [e.clientX, e.clientY];
      });

      canvas.addEventListener("pointerdown", function (e) {
        var dpr = W / innerWidth;
        var px = e.clientX * dpr;
        var py = H - e.clientY * dpr;
        var now = performance.now() / 1000;
        var near = -1,
          best = 1e9;
        spheres.forEach(function (s, i) {
          var d = Math.hypot(px - s.cx, py - s.cy);
          if (d < best) {
            best = d;
            near = i;
          }
        });
        spheres.forEach(function (s, i) {
          s.t0 = now;
          s.amp = i === near && best < R ? 1.0 : 0.38;
        });
      });

      // --- the picker
      var dot = document.getElementById("dot");
      var pal = document.getElementById("pal");

      PALETTES.forEach(function (p, i) {
        var row = document.createElement("div");
        row.className = "row";
        row.innerHTML = p
          .map(function (c) {
            return '<span style="background:' + c + '"></span>';
          })
          .join("");
        row.addEventListener("click", function () {
          setPalette(i);
        });
        pal.appendChild(row);
      });

      dot.addEventListener("click", function (e) {
        e.stopPropagation();
        pal.classList.toggle("open");
        if (pal.classList.contains("open"))
          pal.children[active].scrollIntoView({ block: "nearest" });
      });

      addEventListener("pointerdown", function (e) {
        if (!document.getElementById("ui").contains(e.target))
          pal.classList.remove("open");
      });

      setPalette(0);

      // --- go
      var start = performance.now();

      function frame() {
        var t = (performance.now() - start) / 1000;

        for (var i = 0; i < 4; i++)
          for (var j = 0; j < 3; j++)
            current[i][j] += (target[i][j] - current[i][j]) * 0.07;

        // mouse speed, measured per frame so a 1000hz mouse isn't louder than a 125hz one
        var speed = Math.hypot(mx - pmx, my - pmy);
        pmx = mx;
        pmy = my;
        wig = Math.min(wig * 0.9 + Math.min(speed * 6.0, 1.0) * 0.35, 1.0);

        // background drifts opposite the cursor, so it reads as further away
        parx += (-mx * 0.06 - parx) * 0.04;
        pary += (my * 0.06 - pary) * 0.04;

        gl.uniform2f(U.u_res, W, H);
        gl.uniform1f(U.u_time, t);
        gl.uniform2f(U.u_par, parx, pary);
        gl.uniform3fv(U.u_c0, current[0]);
        gl.uniform3fv(U.u_c1, current[1]);
        gl.uniform3fv(U.u_c2, current[2]);
        gl.uniform3fv(U.u_c3, current[3]);

        for (var k = 0; k < 4; k++) {
          var s = spheres[k];
          s.tx = my * 1.5 * s.spin;
          s.ty = mx * 1.5 * s.spin;
          s.rx += (s.tx - s.rx) * 0.05;
          s.ry += (s.ty - s.ry) * 0.05;

          var age = performance.now() / 1000 - s.t0;
          var amp = s.amp * Math.exp(-age * 3.1);
          if (amp < 0.001) amp = 0;

          // whichever sphere the cursor is closest to shakes hardest
          var dpr = W / innerWidth;
          var dist = Math.hypot(
            cursor[0] * dpr - s.cx,
            H - cursor[1] * dpr - s.cy
          );
          var prox = Math.max(0.35, Math.min(1, 1.35 - dist / (R * 1.6)));

          gl.uniform4f(
            U["a" + k],
            s.cx,
            s.cy,
            s.rx + t * s.drift * 0.35,
            s.ry + t * s.drift
          );
          gl.uniform4f(U["b" + k], R, amp, age * 15.0, wig * s.wig * prox);
        }

        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
