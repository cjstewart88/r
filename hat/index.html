<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>hat</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #04050a;
        cursor: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d", { alpha: false });

      const mk = () => document.createElement("canvas");
      // two spectacle buffers, ping-ponged: it eats its own image and magnifies it
      const spA = mk(), spB = mk();
      const spc = [spA.getContext("2d"), spB.getContext("2d")];
      let cur = 0;
      // the fabric: permanent, made by hand
      const fab = mk(), fx = fab.getContext("2d");
      // small blurred copy of the fabric, reused for glow and for the crawling light
      const sml = mk(), mx = sml.getContext("2d");
      const shim = mk(), hx = shim.getContext("2d");
      const noise = mk();

      const CW = 15, CH = 11;
      const SS = 0.5;   // spectacle resolution
      const FS = 0.25;  // glow resolution
      const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      const SERIF = "Georgia, 'Times New Roman', serif";

      let W = 0, H = 0, DPR = 1, cols = 0, rows = 0, grain = null, LOW = false;
      let t = 0, last = 0, ms = 16, frames = 0;

      /* ================= the story ================= */

      const COMMUTE = 0, FAITH = 1, AGENTS = 2, EDGE = 3, HANDS = 4, GIVE = 5;
      const DUR = [17, 17, 15, 15, Infinity, 26];
      let act = COMMUTE, at = 0;

      // [when, lines, howLong]
      const SCRIPT = [
        [[1.4, ["early thirties. slacks.", "dirty white sneakers."], 5],
         [7, ["for half an hour he explained", "margin expansion, ARR, EBITDA"], 6],
         [13.6, ["in painfully monotone detail"], 3.4]],

        [[1, ["he had given it everything"], 4.6],
         [6.2, ["the office, for the same reason", "the devout attend church"], 6],
         [12.8, ["it's where he felt", "most himself"], 4.2]],

        [[1, ["then the agents arrived"], 4.4],
         [5.8, ["i don't build the pitch.", "i write the query that writes it."], 6.4],
         [12.6, ["and check the work afterward"], 2.4]],

        [[1.2, ["one morning he woke up", "at the edge of it"], 5.4],
         [7.4, ["what the fuck", "are we actually doing"], 6.4]],

        [],

        [[1.6, ["almost no one will remember", "all the work we do"], 6.4],
         [8.6, ["but they might remember", "how we treated each other"], 6.6],
         [16, ["even if it's just", "one knitted hat at a time"], 9]],
      ];

      // the lines he arrives at himself. once said, a line stays said.
      const QUOTES = [
        ["what appears is good", "what is good appears"],
        ["everything directly lived", "receded into a representation"],
        ["the messy middle", "is not inefficiency"],
        ["no one has ever died", "over a spreadsheet"],
      ];
      const MARKS = [0.03, 0.24, 0.48, 0.72];
      const SLOTS = [
        [0.035, 0.15, "left"],
        [0.965, 0.34, "right"],
        [0.035, 0.62, "left"],
        [0.965, 0.83, "right"],
      ];

      const JARGON = [
        "EBITDA", "margin expansion", "ARR", "cost structure", "headcount",
        "synergy", "deck_v7_FINAL_final", "resting & vesting", "promo packet",
        "Q3 roadmap", "alignment", "circle back", "impact narrative",
        "north star", "learn to code", "agent run complete", "generated in 0.4s",
        "strategy doc", "rebrand v2", "quick sync", "OKR review", "burn multiple",
        "org redesign", "value prop", "action items", "per my last email",
        "the deck", "the deck", "the deck",
      ];

      /* ================= the person ================= */

      // side view, facing right. units: 100 = standing height, y up from the floor.
      const POSES = {
        sit: {
          hip: [0, 44], kneeB: [22, 44], footB: [25, 2], kneeF: [27, 45], footF: [31, 2],
          chest: [-5, 71], neck: [-6, 79], head: [2, 89],
          elbowB: [7, 62], handB: [23, 55], elbowF: [10, 63], handF: [26, 56],
        },
        slump: {
          hip: [0, 42], kneeB: [22, 42], footB: [25, 2], kneeF: [27, 43], footF: [31, 2],
          chest: [-9, 66], neck: [-11, 73], head: [-2, 82],
          elbowB: [5, 58], handB: [21, 51], elbowF: [8, 59], handF: [24, 52],
        },
        idle: {
          hip: [0, 43], kneeB: [22, 43], footB: [25, 2], kneeF: [27, 44], footF: [31, 2],
          chest: [-7, 68], neck: [-9, 76], head: [-3, 85],
          elbowB: [2, 58], handB: [12, 44], elbowF: [4, 59], handF: [15, 45],
        },
        stand: {
          hip: [0, 51], kneeB: [-4, 26], footB: [-7, 0], kneeF: [4, 26], footF: [7, 0],
          chest: [0, 79], neck: [0, 87], head: [0, 97],
          elbowB: [-7, 66], handB: [-8, 53], elbowF: [7, 66], handF: [8, 53],
        },
        give: {
          hip: [0, 51], kneeB: [-5, 26], footB: [-9, 0], kneeF: [5, 26], footF: [8, 0],
          chest: [1, 79], neck: [2, 87], head: [4, 96],
          elbowB: [-6, 66], handB: [-7, 54], elbowF: [16, 71], handF: [33, 72],
        },
        reach: {
          hip: [0, 47], kneeB: [-4, 24], footB: [-7, 0], kneeF: [4, 24], footF: [7, 0],
          chest: [-1, 74], neck: [-2, 81], head: [-3, 90],
          elbowB: [-10, 66], handB: [-13, 76], elbowF: [-2, 64], handF: [-6, 76],
        },
      };
      const JOINTS = Object.keys(POSES.sit);
      const BONES = [
        ["hip", "kneeB", 4.6, 1], ["kneeB", "footB", 4, 1],
        ["chest", "elbowB", 4, 1], ["elbowB", "handB", 3.4, 1],
        ["hip", "chest", 8, 0], ["chest", "neck", 6.5, 0],
        ["hip", "kneeF", 5, 0], ["kneeF", "footF", 4.4, 0],
        ["chest", "elbowF", 4.4, 0], ["elbowF", "handF", 3.8, 0],
      ];

      const pose = {};
      for (const j of JOINTS) pose[j] = [0, 0];

      function setPose(name, u) {
        const p = POSES[name];
        for (const j of JOINTS) {
          pose[j][0] += (p[j][0] - pose[j][0]) * u;
          pose[j][1] += (p[j][1] - pose[j][1]) * u;
        }
      }
      function snapPose(name) {
        const p = POSES[name];
        for (const j of JOINTS) { pose[j][0] = p[j][0]; pose[j][1] = p[j][1]; }
      }

      // where a joint actually lands on screen
      function jx(j, f) { return f.x + pose[j][0] * f.s * (f.flip || 1); }
      function jy(j, f) { return f.y - pose[j][1] * f.s; }
      function px(p, j, f) { return f.x + p[j][0] * f.s * (f.flip || 1); }
      function py(p, j, f) { return f.y - p[j][1] * f.s; }

      function drawFigure(f, p) {
        const s = f.s;
        const wire = f.wire || 0;
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalAlpha = f.a === undefined ? 1 : f.a;
        if (wire > 0.02) ctx.setLineDash([3 + wire * 5, wire * 7]);
        // cold and flat, or warm and solid, or half dissolved into the wireframe
        const wm = f.warm || 0;
        const hu = (206 - wire * 10) + (30 - (206 - wire * 10)) * wm;
        const sa = (16 + wire * 34) + (62 - (16 + wire * 34)) * wm;
        const li = (58 - wire * 8) + (64 - (58 - wire * 8)) * wm;
        for (const [a, b, w, back] of BONES) {
          const jit = wire * 2.4;
          const lit = back ? 0.66 : 1;
          ctx.strokeStyle = "hsl(" + hu.toFixed(0) + " " + (sa * (back ? 0.72 : 1)).toFixed(0) + "% " + (li * lit).toFixed(0) + "%)";
          ctx.lineWidth = Math.max(1, (w - wire * 2.4) * s * 0.1);
          ctx.beginPath();
          ctx.moveTo(px(p, a, f) + (Math.random() - 0.5) * jit, py(p, a, f) + (Math.random() - 0.5) * jit);
          ctx.lineTo(px(p, b, f) + (Math.random() - 0.5) * jit, py(p, b, f) + (Math.random() - 0.5) * jit);
          ctx.stroke();
        }
        // head
        const hxp = px(p, "head", f), hyp = py(p, "head", f);
        ctx.setLineDash([]);
        ctx.lineWidth = Math.max(1, s * 0.5 * (1 - wire * 0.6));
        ctx.strokeStyle = "hsl(" + hu.toFixed(0) + " " + sa.toFixed(0) + "% " + (li + 2).toFixed(0) + "%)";
        ctx.beginPath();
        ctx.arc(hxp, hyp, s * 6.4, 0, 6.283);
        if (wire > 0.5) ctx.stroke(); else { ctx.fillStyle = ctx.strokeStyle; ctx.fill(); }
        ctx.restore();
      }

      /* ================= state ================= */

      let stitches = [];
      const filled = new Set();
      let hatPath = null, hatDots = [], hatSet = new Set(), hatTotal = 0, hatFilled = 0;
      let smlDirty = true;

      let pointer = { x: 0, y: 0, has: false };
      let needle = { x: 0, y: 0, px: 0, py: 0, ang: 0 };
      let yarn = [];
      const YN = 28, BX = 52;
      let idle = 0, murk = 0, murkT = 0, bloom = 0, opening = 0;
      let said = [], quoteIdx = -1, caption = null;
      let vp = { x: 0, y: 0 };

      let hero = { x: 0, y: 0, s: 3, a: 1, wire: 0, warm: 0, flip: 1 };
      let child = { x: 0, y: 0, s: 2, a: 0, wire: 0, warm: 1, flip: -1 };
      let crowd = [];
      let agents = [];
      let streaks = [];
      let lens = 0, lensT = 0;      // 0 = a laptop screen, 1 = the whole world
      let fall = 0, hollow = 0, flash = 0, handoff = 0, deskGlow = 1;

      /* ================= setup ================= */

      function buildHat() {
        const w = Math.min(W * 0.4, 520);
        const h = w * 0.86;
        const cx = W / 2, cy = H / 2 + h * 0.04;
        const left = cx - w / 2, right = cx + w / 2;
        const bottom = cy + h / 2;
        const brimTop = bottom - h * 0.2;
        const apex = brimTop - h * 0.78;
        const ytop = (8 * apex - 2 * brimTop) / 6;

        const p = new Path2D();
        p.moveTo(left, brimTop);
        p.bezierCurveTo(left + w * 0.03, ytop, right - w * 0.03, ytop, right, brimTop);
        p.lineTo(right, bottom);
        p.lineTo(left, bottom);
        p.closePath();
        const bw = w * 0.06;
        p.moveTo(left - bw, brimTop);
        p.lineTo(right + bw, brimTop);
        p.lineTo(right + bw, bottom);
        p.lineTo(left - bw, bottom);
        p.closePath();
        const pr = w * 0.11;
        p.moveTo(cx + pr, apex - pr * 0.5);
        p.arc(cx, apex - pr * 0.5, pr, 0, Math.PI * 2);
        hatPath = p;

        hatSet = new Set();
        hatDots = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * CW + CW / 2, y = r * CH + CH / 2;
            if (!ctx.isPointInPath(p, x, y)) continue;
            hatSet.add(r * cols + c);
            if (Math.random() < 0.03) hatDots.push({ x, y, p: Math.random() * 6.28 });
          }
        }
        hatTotal = hatSet.size;
        hatFilled = 0;
        for (const s of stitches) if (hatSet.has(s.r * cols + s.c)) hatFilled++;
      }

      function makeNoise() {
        noise.width = noise.height = 128;
        const n = noise.getContext("2d");
        const d = n.createImageData(128, 128);
        for (let i = 0; i < d.data.length; i += 4) {
          d.data[i] = d.data[i + 1] = d.data[i + 2] = 210 + Math.random() * 45;
          d.data[i + 3] = Math.random() * 92;
        }
        n.putImageData(d, 0, 0);
        grain = ctx.createPattern(noise, "repeat");
      }

      function sizeTo(el, c, sc) {
        el.width = Math.max(1, Math.round(W * sc));
        el.height = Math.max(1, Math.round(H * sc));
        c.setTransform(sc, 0, 0, sc, 0, 0);
      }

      function stage() {
        const s = Math.min(H * 0.0034, W * 0.0026);
        hero.s = s;
        hero.x = W * 0.38;
        hero.y = H * 0.8;
        child.s = s * 0.62;
        child.x = W * 0.63;
        child.y = H * 0.8;
        crowd = [];
        for (const [ox, sc, al] of [[-0.3, 0.72, 0.3], [-0.17, 0.8, 0.36], [0.2, 0.78, 0.34], [0.34, 0.7, 0.28], [0.47, 0.62, 0.22]]) {
          crowd.push({ x: W * (0.38 + ox), y: H * (0.8 - (1 - sc) * 0.06), s: s * sc, a: al, warm: 0, wire: 0, gone: 0, flip: 1 });
        }
        streaks = [];
        for (let i = 0; i < 26; i++) streaks.push({ x: Math.random() * W, y: H * (0.08 + Math.random() * 0.3), w: 30 + Math.random() * 220, v: 300 + Math.random() * 900 });
      }

      function resize() {
        DPR = LOW ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
        W = window.innerWidth;
        H = window.innerHeight;
        sizeTo(cv, ctx, DPR);
        sizeTo(fab, fx, DPR);
        sizeTo(spA, spc[0], SS);
        sizeTo(spB, spc[1], SS);
        sizeTo(sml, mx, FS);
        sizeTo(shim, hx, FS);
        cols = Math.ceil(W / CW) + 1;
        rows = Math.ceil(H / CH) + 1;
        filled.clear();
        for (const s of stitches) filled.add(s.c + "," + s.r);
        fx.clearRect(0, 0, W, H);
        for (const s of stitches) ink(s);
        smlDirty = true;
        vp.x = W / 2;
        vp.y = H / 2;
        stage();
        initYarn();
        makeNoise();
        buildHat();
      }

      /* ================= the fabric ================= */

      function ink(s) {
        const x = s.c * CW + CW / 2, y = s.r * CH + CH / 2;
        fx.lineCap = "round";
        fx.lineJoin = "round";
        fx.strokeStyle = "hsla(" + (s.h - 24) + " 78% 22% / 0.75)";
        fx.lineWidth = 4.4;
        fx.beginPath();
        fx.moveTo(x - CW * 0.46, y - CH * 0.2);
        fx.quadraticCurveTo(x, y + CH * 0.72, x + CW * 0.46, y - CH * 0.2);
        fx.stroke();
        fx.strokeStyle = "hsl(" + s.h + " 88% " + s.l + "%)";
        fx.lineWidth = 2.8;
        fx.beginPath();
        fx.moveTo(x - CW * 0.46, y - CH * 0.44);
        fx.quadraticCurveTo(x, y + CH * 0.5, x + CW * 0.46, y - CH * 0.44);
        fx.stroke();
        fx.strokeStyle = "hsla(" + (s.h + 26) + " 100% 88% / 0.5)";
        fx.lineWidth = 1;
        fx.beginPath();
        fx.moveTo(x - CW * 0.3, y - CH * 0.3);
        fx.quadraticCurveTo(x, y + CH * 0.28, x + CW * 0.3, y - CH * 0.3);
        fx.stroke();
      }

      function knitAt(x, y, rad) {
        const c0 = Math.max(0, Math.floor((x - rad) / CW));
        const c1 = Math.min(cols - 1, Math.floor((x + rad) / CW));
        const r0 = Math.max(0, Math.floor((y - rad) / CH));
        const r1 = Math.min(rows - 1, Math.floor((y + rad) / CH));
        for (let r = r0; r <= r1; r++) {
          for (let c = c0; c <= c1; c++) {
            const cxp = c * CW + CW / 2, cyp = r * CH + CH / 2;
            const dx = cxp - x, dy = (cyp - y) * 1.3;
            if (dx * dx + dy * dy > rad * rad) continue;
            const k = c + "," + r;
            if (filled.has(k)) continue;
            filled.add(k);
            const base = 296 + 74 * (0.5 + 0.5 * Math.sin(t * 0.11 + (cxp + cyp) * 0.0016));
            const s = { c, r, h: (base + Math.random() * 16 - 8) % 360, l: 62 + Math.random() * 10 };
            stitches.push(s);
            ink(s);
            smlDirty = true;
            if (hatSet.has(r * cols + c)) hatFilled++;
          }
        }
      }

      function knitAlong(ax, ay, bx, by) {
        const d = Math.hypot(bx - ax, by - ay);
        const steps = Math.min(44, Math.ceil(d / 8) + 1);
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          knitAt(ax + (bx - ax) * u, ay + (by - ay) * u, 21);
        }
      }

      function initYarn() {
        yarn = [];
        const bx = BX, by = H - 52;
        for (let i = 0; i < YN; i++) {
          const u = i / (YN - 1);
          const x = needle.x + (bx - needle.x) * u, y = needle.y + (by - needle.y) * u;
          yarn.push({ x, y, ox: x, oy: y });
        }
      }

      /* ================= the spectacle ================= */

      function stamp(d, x, y, hue, cold) {
        d.save();
        d.translate(x, y);
        d.rotate((Math.random() - 0.5) * 0.14);
        d.lineWidth = 1.4;
        const w = 16 + Math.random() * 54;
        const h = w * (0.42 + Math.random() * 0.4);
        const rings = 2 + ((Math.random() * 3) | 0);
        for (let k = 0; k < rings; k++) {
          const p = k * Math.min(w, h) * 0.14;
          d.strokeStyle = "hsla(" + hue + " " + (48 * cold + 30) + "% " + (58 + k * 6) + "% / " + (0.5 - k * 0.09) + ")";
          d.strokeRect(-w / 2 + p, -h / 2 + p, w - p * 2, h - p * 2);
        }
        if (hollow < 0.5) {
          d.fillStyle = "hsla(" + hue + " 40% 62% / 0.18)";
          for (let l = 0; l < 3; l++) d.fillRect(-w / 2 + 4, -h / 2 + 5 + l * 4, (w - 8) * (0.3 + Math.random() * 0.65), 1.4);
        }
        d.restore();
      }

      function feed(dt) {
        const src = cur ? spB : spA;
        const d = spc[1 - cur];
        cur = 1 - cur;

        const zoom = 1 + (bloom > 0 ? -0.007 * bloom : 0.012 * (1 - murk * 0.3) * (1 - hollow * 0.7));
        d.setTransform(SS, 0, 0, SS, 0, 0);
        d.globalCompositeOperation = "copy";
        d.globalAlpha = 0.962;
        d.translate(vp.x, vp.y + fall * dt * 60);
        d.scale(zoom, zoom);
        d.rotate(0.0024 * Math.sin(t * 0.19) + 0.001);
        d.translate(-vp.x, -vp.y);
        d.drawImage(src, 0, 0, W, H);

        d.setTransform(SS, 0, 0, SS, 0, 0);
        d.globalCompositeOperation = "source-over";
        d.globalAlpha = 1;

        const hue = 196 + 26 * Math.sin(t * 0.07) + bloom * 130;
        const cold = 1 - bloom * 0.85;
        const rate = act === EDGE ? 0.25 : 1;

        // roles supporting roles supporting roles
        if (Math.random() < rate) {
          for (let i = 0, n = Math.random() < 0.5 ? 2 : 1; i < n; i++) {
            const a = Math.random() * 6.283, rad = Math.random() * 46 * (0.4 + lens * 0.6);
            stamp(d, vp.x + Math.cos(a) * rad, vp.y + Math.sin(a) * rad, hue, cold);
          }
        }
        // once the agents are loose, the work makes itself wherever they are
        for (const g of agents) {
          if (Math.random() < 0.09) stamp(d, g.x, g.y, hue + 20, cold);
        }

        // language, stamped small, magnified until it means nothing
        if (Math.random() < dt * 3.2 * rate) {
          const a = Math.random() * 6.283, rad = Math.random() * 30;
          d.save();
          d.translate(vp.x + Math.cos(a) * rad, vp.y + Math.sin(a) * rad);
          d.rotate((Math.random() - 0.5) * 0.2);
          d.font = (7 + Math.random() * 4).toFixed(1) + "px " + MONO;
          d.textAlign = "center";
          d.fillStyle = "hsla(" + (hue + 14) + " 60% 78% / 0.8)";
          d.fillText(JARGON[(Math.random() * JARGON.length) | 0], 0, 0);
          d.restore();
        }
      }

      /* ================= acts ================= */

      function lensRect() {
        // the laptop screen, opening until it is everything
        const hxp = jx("handF", hero), hyp = jy("handF", hero);
        const lw = hero.s * 26, lh = hero.s * 17;
        const x0 = hxp + hero.s * 3, y0 = hyp - lh - hero.s * 2;
        const u = lens * lens;
        return {
          x: x0 + (0 - x0) * u,
          y: y0 + (0 - y0) * u,
          w: lw + (W - lw) * u,
          h: lh + (H - lh) * u,
        };
      }

      function advance() {
        if (act >= GIVE) return;
        if (act === HANDS) return;
        act++;
        at = 0;
        caption = null;
        if (act === HANDS) {
          needle.x = pointer.x = jx("handF", hero);
          needle.y = pointer.y = jy("handF", hero);
          needle.px = needle.x;
          needle.py = needle.y;
          initYarn();
          opening = 0;
        }
      }

      function story(dt) {
        at += dt;
        if (at > DUR[act]) advance();

        // captions for this act
        const sc = SCRIPT[act];
        let show = null;
        for (const [when, lines, dur] of sc) {
          if (at >= when && at < when + (dur || 5.5)) show = { lines, u: (at - when) / (dur || 5.5), dur: dur || 5.5, when };
        }
        caption = show;

        const tgt = { lens: 1, wire: 0, warm: 0, fall: 0, hollow: 0, deskGlow: 0, ha: 1 };
        let poseName = "stand", poseRate = 2.4;
        murkT = 0;

        if (act === COMMUTE) {
          tgt.lens = 0;
          tgt.deskGlow = 1;
          poseName = at > 11 ? "slump" : "sit";
          vp.x += (jx("handF", hero) + hero.s * 16 - vp.x) * dt * 3;
          vp.y += (jy("handF", hero) - hero.s * 11 - vp.y) * dt * 3;
          // he is talking. it comes out as this.
          if (Math.random() < dt * 2.6) {
            agents.push({
              x: jx("head", hero) + hero.s * 6, y: jy("head", hero) + hero.s * 2,
              vx: 26 + Math.random() * 40, vy: (Math.random() - 0.5) * 14,
              a: 1, life: 3.4, word: JARGON[(Math.random() * JARGON.length) | 0], talk: 1,
            });
          }
        } else if (act === FAITH) {
          tgt.lens = 0.34;
          tgt.deskGlow = 1;
          poseName = at > 8 ? "slump" : "sit";
          vp.x += (jx("handF", hero) + hero.s * 16 - vp.x) * dt * 3;
          vp.y += (jy("handF", hero) - hero.s * 11 - vp.y) * dt * 3;
          // the years go by. the seats empty out.
          for (let i = 0; i < crowd.length; i++) {
            if (at > 6 + i * 2.1 && crowd[i].gone < 1) crowd[i].gone = Math.min(1, crowd[i].gone + dt * 0.9);
          }
        } else if (act === AGENTS) {
          tgt.lens = 1;
          tgt.wire = Math.min(1, at / 11);
          tgt.deskGlow = 0.5;
          poseName = at > 4 ? "idle" : "sit";
          if (Math.random() < dt * 9) {
            const r = lensRect();
            agents.push({
              x: r.x + r.w * 0.5 + (Math.random() - 0.5) * r.w * 0.3,
              y: r.y + r.h * 0.5 + (Math.random() - 0.5) * r.h * 0.3,
              vx: (Math.random() - 0.5) * 320, vy: (Math.random() - 0.5) * 240,
              a: 1, life: 2.4 + Math.random() * 2.4, talk: 0,
            });
          }
        } else if (act === EDGE) {
          tgt.wire = Math.max(0, 1 - at * 0.5);
          poseName = at < 3.2 ? "idle" : "stand";
          poseRate = 1.4;
          // the rising tide, right up until it breaks
          murkT = at < 6.6 ? Math.min(1, Math.max(0, at - 1) / 5.5) : 0;
          if (at > 6.6) { tgt.hollow = 1; tgt.fall = 1.1; }
          if (at > 6.6 && at < 6.9) flash = 1;
          agents.length = 0;
        } else if (act === HANDS) {
          tgt.hollow = 1;
          tgt.ha = 0;                 // you are him now. he is not on screen.
          poseName = "reach";
          if (opening === 0) opening = 0.0001;
        } else if (act === GIVE) {
          tgt.hollow = 1;
          tgt.warm = 1;
          tgt.ha = 1;
          poseName = at > 6 ? "give" : "stand";
          handoff = Math.min(1, Math.max(0, (at - 7) / 3.4));
          child.a += ((at > 4 ? 1 : 0) - child.a) * dt * 1.2;
          if (at > 12) child.warm = 1;
        }

        setPose(poseName, Math.min(1, dt * poseRate));
        lens += (tgt.lens - lens) * Math.min(1, dt * 0.9);
        hero.wire += (tgt.wire - hero.wire) * Math.min(1, dt * 1.2);
        hero.warm += (tgt.warm - hero.warm) * Math.min(1, dt * 0.7);
        hero.a += (tgt.ha - hero.a) * Math.min(1, dt * 1.6);
        fall += (tgt.fall - fall) * Math.min(1, dt * 0.8);
        hollow += (tgt.hollow - hollow) * Math.min(1, dt * 1.5);
        deskGlow += (tgt.deskGlow - deskGlow) * Math.min(1, dt * 1.5);
        flash = Math.max(0, flash - dt * 2.2);

        for (const g of agents) {
          g.x += g.vx * dt;
          g.y += g.vy * dt;
          if (!g.talk) { g.vx *= 0.99; g.vy += 6 * dt; }
          g.life -= dt;
          g.a = Math.min(1, g.life);
        }
        agents = agents.filter((g) => g.life > 0);

        for (const s of streaks) {
          s.x -= s.v * dt;
          if (s.x + s.w < 0) { s.x = W + Math.random() * 200; s.y = H * (0.08 + Math.random() * 0.3); }
        }
      }

      /* ================= loop ================= */

      function frame(now) {
        const raw = now - last;
        const dt = Math.min(0.05, raw / 1000 || 0.016);
        last = now;
        t += dt;

        ms += (Math.min(80, raw) - ms) * 0.05;
        if (++frames === 150 && ms > 26 && !LOW) { LOW = true; resize(); }

        story(dt);

        const prog = hatTotal ? Math.min(1, hatFilled / (hatTotal * 0.8)) : 0;
        if (act === HANDS) {
          opening += dt;
          if (prog >= 1) { act = GIVE; at = 0; caption = null; snapPose("reach"); }
        }
        if (act === GIVE) bloom = Math.min(1, bloom + dt * 0.22);

        // hands
        needle.px = needle.x;
        needle.py = needle.y;
        const tx = pointer.has ? pointer.x : W / 2;
        const ty = pointer.has ? pointer.y : H / 2;
        needle.x += (tx - needle.x) * Math.min(1, dt * 10);
        needle.y += (ty - needle.y) * Math.min(1, dt * 10);
        const mvd = Math.hypot(needle.x - needle.px, needle.y - needle.py);
        if (act === HANDS && mvd > 0.4) {
          needle.ang = Math.atan2(needle.y - needle.py, needle.x - needle.px);
          knitAlong(needle.px, needle.py, needle.x, needle.y);
          idle = 0;
        } else idle += dt;

        const want = act === HANDS ? Math.min(1, Math.max(0, idle - 1.4) / 6) : murkT;
        murk += (want - murk) * Math.min(1, dt * (want > murk ? 0.55 : 3.2));

        if (act >= AGENTS) {
          const wx = W / 2 + Math.cos(t * 0.13) * W * 0.16 + Math.sin(t * 0.31) * W * 0.05;
          const wy = H / 2 + Math.sin(t * 0.17) * H * 0.16 + Math.cos(t * 0.27) * H * 0.05;
          const pull = act === HANDS ? 0.28 : 0;
          vp.x += (wx * (1 - pull) + needle.x * pull - vp.x) * dt * 0.7;
          vp.y += (wy * (1 - pull) + needle.y * pull - vp.y) * dt * 0.7;
        }

        // the strand: a rope pinned at both ends
        const bx = BX, by = H - 52;
        const seg = Math.max(4, (Math.hypot(needle.x - bx, needle.y - by) * 1.12) / (YN - 1));
        const grav = 1400 * dt * dt;
        for (let i = 1; i < YN - 1; i++) {
          const p = yarn[i];
          const vx = (p.x - p.ox) * 0.94, vy = (p.y - p.oy) * 0.94;
          p.ox = p.x;
          p.oy = p.y;
          p.x += vx + Math.sin(t * 1.7 + i * 0.7) * 0.14;
          p.y += vy + grav;
        }
        for (let k = 0; k < 5; k++) {
          yarn[0].x = needle.x; yarn[0].y = needle.y;
          yarn[YN - 1].x = bx; yarn[YN - 1].y = by;
          for (let i = 0; i < YN - 1; i++) {
            const a = yarn[i], b = yarn[i + 1];
            const dx = b.x - a.x, dy = b.y - a.y;
            const d = Math.hypot(dx, dy) || 0.0001;
            const pinA = i === 0, pinB = i + 1 === YN - 1;
            const f = ((d - seg) / d) * (pinA || pinB ? 1 : 0.5);
            if (!pinA) { a.x += dx * f; a.y += dy * f; }
            if (!pinB) { b.x -= dx * f; b.y -= dy * f; }
          }
        }
        yarn[0].x = needle.x; yarn[0].y = needle.y;
        yarn[YN - 1].x = bx; yarn[YN - 1].y = by;

        if (smlDirty) {
          mx.setTransform(FS, 0, 0, FS, 0, 0);
          mx.globalCompositeOperation = "copy";
          mx.filter = "blur(1.6px)";
          mx.drawImage(fab, 0, 0, W, H);
          mx.filter = "none";
          mx.globalCompositeOperation = "source-over";
          smlDirty = false;
        }

        feed(dt);
        draw(prog, dt);
        requestAnimationFrame(frame);
      }

      /* ================= paint ================= */

      function warp(src, amp, phase, alpha, op) {
        const bands = LOW ? 20 : 32;
        const bh = H / bands;
        const sc = src.height / H;
        ctx.globalCompositeOperation = op;
        ctx.globalAlpha = alpha;
        for (let i = 0; i < bands; i++) {
          const y = i * bh;
          const off = Math.sin(phase + i * 0.36) * amp + Math.sin(phase * 0.53 + i * 0.12) * amp * 0.6;
          ctx.drawImage(src, 0, y * sc, src.width, bh * sc + 1, off, y, W, bh + 1);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }

      // type has to survive whatever is thrashing behind it
      function say(lines, x, y, fs, a, hue, face, align) {
        if (a <= 0) return;
        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.textAlign = align || "center";
        ctx.font = (face ? "" : "italic ") + fs.toFixed(1) + "px " + (face || SERIF);
        let tw = 0;
        for (const ln of lines) tw = Math.max(tw, ctx.measureText(ln).width);
        const th = lines.length * fs * 1.5;
        const mid = x + (align === "left" ? tw / 2 : align === "right" ? -tw / 2 : 0);

        const scrim = 0.4 + 0.6 * a;
        const r = (tw + fs * 4) / 2;
        ctx.save();
        ctx.translate(mid, y + th / 2 - fs * 0.7);
        ctx.scale(1, Math.max(0.3, (th + fs * 1.4) / (r * 2)));
        const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
        sg.addColorStop(0, "rgba(3,4,8," + (0.85 * scrim).toFixed(3) + ")");
        sg.addColorStop(0.55, "rgba(3,4,8," + (0.62 * scrim).toFixed(3) + ")");
        sg.addColorStop(1, "rgba(3,4,8,0)");
        ctx.fillStyle = sg;
        ctx.fillRect(-r, -r, r * 2, r * 2);
        ctx.restore();

        ctx.globalAlpha = a;
        ctx.fillStyle = "rgba(255,250,252,0.97)";
        lines.forEach((ln, i) => {
          const yy = y + i * fs * 1.5;
          if (a > 0.62) {
            ctx.shadowColor = "hsla(" + hue + " 92% 54% / 0.85)";
            ctx.shadowBlur = fs * 1.2;
            ctx.fillText(ln, x, yy);
          }
          ctx.shadowColor = "rgba(0,0,0,0.92)";
          ctx.shadowBlur = fs * 0.34;
          ctx.fillText(ln, x, yy);
          ctx.shadowColor = "transparent";
          ctx.shadowBlur = 0;
          ctx.fillText(ln, x, yy);
        });
        ctx.restore();
      }

      function drawLaptop() {
        if (deskGlow < 0.02 || lens > 0.6) return;
        const r = lensRect();
        ctx.save();
        ctx.globalAlpha = deskGlow * (1 - lens * 1.6);
        ctx.strokeStyle = "hsla(200 60% 70% / 0.5)";
        ctx.lineWidth = Math.max(1, hero.s * 0.4);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        // the base, the shared table, the seat
        const s = hero.s;
        ctx.beginPath();
        ctx.moveTo(r.x - r.w * 0.08, r.y + r.h);
        ctx.lineTo(r.x + r.w * 1.05, r.y + r.h);
        ctx.moveTo(hero.x + s * 14, r.y + r.h + s * 2);
        ctx.lineTo(hero.x + s * 62, r.y + r.h + s * 2);
        ctx.moveTo(hero.x - s * 16, hero.y - s * 41);
        ctx.lineTo(hero.x + s * 18, hero.y - s * 41);
        ctx.moveTo(hero.x - s * 16, hero.y - s * 41);
        ctx.lineTo(hero.x - s * 18, hero.y - s * 74);
        ctx.stroke();
        // the light it throws on him
        const g = ctx.createRadialGradient(r.x, r.y + r.h * 0.5, 0, r.x, r.y + r.h * 0.5, r.w * 2.6);
        g.addColorStop(0, "hsla(198 90% 66% / " + (0.24 * deskGlow) + ")");
        g.addColorStop(1, "hsla(198 90% 66% / 0)");
        ctx.fillStyle = g;
        ctx.fillRect(r.x - r.w * 2.6, r.y - r.w * 2.6, r.w * 5.2, r.w * 5.2);
        ctx.restore();
      }

      function drawHat(x, y, s, a) {
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(x, y);
        ctx.fillStyle = "hsl(336 74% 62%)";
        ctx.strokeStyle = "hsl(336 74% 72%)";
        ctx.lineWidth = s * 0.16;
        ctx.beginPath();
        ctx.moveTo(-s, 0);
        ctx.bezierCurveTo(-s * 0.95, -s * 1.5, s * 0.95, -s * 1.5, s, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-s * 1.14, 0, s * 2.28, s * 0.4);
        ctx.beginPath();
        ctx.arc(0, -s * 1.12, s * 0.26, 0, 6.283);
        ctx.fill();
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath();
          ctx.moveTo(i * s * 0.28, 0);
          ctx.lineTo(i * s * 0.24, -s * (1.05 - Math.abs(i) * 0.12));
          ctx.stroke();
        }
        ctx.restore();
      }

      function draw(prog, dt) {
        const v = Math.round(bloom * 10);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgb(" + (4 + v) + "," + (5 + v * 0.5) + "," + (9 + v * 0.6) + ")";
        ctx.fillRect(0, 0, W, H);

        // the train, still moving
        if (act <= FAITH) {
          const a = act === COMMUTE ? 1 : Math.max(0, 1 - at / 6);
          ctx.save();
          ctx.globalAlpha = a * 0.5;
          ctx.strokeStyle = "hsla(208 40% 62% / 0.5)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (const s of streaks) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.w, s.y); }
          ctx.stroke();
          ctx.restore();
        }

        // the spectacle, seen through whatever is containing it
        const r = lensRect();
        ctx.save();
        ctx.beginPath();
        ctx.rect(r.x, r.y, r.w, r.h);
        ctx.clip();
        warp(cur ? spB : spA, 5 + murk * 9 - bloom * 3, t * 0.9, 0.95, "lighter");
        ctx.restore();
        drawLaptop();

        // the others, and then the empty seats
        for (const c of crowd) {
          if (c.gone >= 1) continue;
          drawFigure({ ...c, a: c.a * (1 - c.gone) * (1 - lens * 0.7) }, POSES.sit);
        }

        // him
        if (hero.a > 0.02) drawFigure(hero, pose);

        // the agents, working
        for (const g of agents) {
          ctx.save();
          ctx.globalAlpha = g.a * 0.9;
          if (g.talk) {
            ctx.font = "9px " + MONO;
            ctx.textAlign = "left";
            ctx.fillStyle = "hsla(205 30% 70% / 0.7)";
            ctx.fillText(g.word, g.x, g.y);
          } else {
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = "hsla(186 90% 70% / 0.9)";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(g.x - 4, g.y - 4);
            ctx.lineTo(g.x + 4, g.y);
            ctx.lineTo(g.x - 4, g.y + 4);
            ctx.stroke();
          }
          ctx.restore();
        }

        // the pattern waiting to be filled
        if (act === HANDS && prog < 1) {
          for (const d of hatDots) {
            const a = (0.1 + 0.14 * (0.5 + 0.5 * Math.sin(t * 1.6 + d.p))) * (1 - prog * 0.7);
            ctx.fillStyle = "hsla(330 90% 78% / " + a.toFixed(3) + ")";
            ctx.fillRect(d.x - 1, d.y - 1, 2, 2);
          }
        }

        // the fabric. at the end it gathers itself into his hands.
        if (stitches.length) {
          const gather = handoff > 0 ? Math.min(1, handoff * 1.6) : 0;
          const hxp = jx("handF", hero), hyp = jy("handF", hero);
          ctx.save();
          if (gather > 0) {
            const k = 1 - gather;
            ctx.globalAlpha = 1 - gather;
            ctx.translate(hxp * gather, hyp * gather);
            ctx.scale(k + gather * 0.02, k + gather * 0.02);
          }
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha *= 0.5 + bloom * 0.35;
          ctx.drawImage(sml, -3, 0, W + 6, H);
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = gather > 0 ? 1 - gather : 1;
          warp(fab, 1.6 + murk * 2.2 + bloom * 2.4, t * 0.7 + 1.3, ctx.globalAlpha, "source-over");
          ctx.restore();

          if (!LOW && gather < 0.5) {
            hx.setTransform(FS, 0, 0, FS, 0, 0);
            hx.globalCompositeOperation = "source-over";
            hx.clearRect(0, 0, W, H);
            const lx = W * (0.5 + 0.55 * Math.sin(t * 0.33)), ly = H * (0.5 + 0.5 * Math.cos(t * 0.24));
            const lg = hx.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * 0.42);
            lg.addColorStop(0, "hsla(" + ((t * 22) % 360) + " 100% 72% / 0.6)");
            lg.addColorStop(0.5, "hsla(" + ((t * 22 + 60) % 360) + " 100% 60% / 0.18)");
            lg.addColorStop(1, "hsla(0 0% 0% / 0)");
            hx.fillStyle = lg;
            hx.fillRect(0, 0, W, H);
            hx.globalCompositeOperation = "destination-in";
            hx.drawImage(sml, 0, 0, W, H);
            ctx.globalCompositeOperation = "lighter";
            ctx.globalAlpha = 0.8 * (1 - gather * 2);
            ctx.drawImage(shim, 0, 0, W, H);
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
          }
        }

        // the strand and the needles: yours, for one act only
        if (act === HANDS) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";
          for (const [wd, al] of [[6, 0.16], [2, 0.9]]) {
            ctx.strokeStyle = "hsla(330 92% 72% / " + al + ")";
            ctx.lineWidth = wd;
            ctx.beginPath();
            ctx.moveTo(yarn[0].x, yarn[0].y);
            for (let i = 1; i < yarn.length - 1; i++) {
              const p = yarn[i], q = yarn[i + 1];
              ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
            }
            ctx.lineTo(yarn[yarn.length - 1].x, yarn[yarn.length - 1].y);
            ctx.stroke();
          }
          const bx = BX, by = H - 52;
          ctx.strokeStyle = "hsla(334 92% 66% / 0.55)";
          ctx.lineWidth = 1.3;
          for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.ellipse(bx, by, 16, 5 + i * 2.2, i * 0.62 + t * 0.16, 0, 6.283);
            ctx.stroke();
          }
          ctx.fillStyle = "hsla(336 90% 60% / 0.3)";
          ctx.beginPath();
          ctx.arc(bx, by, 15, 0, 6.283);
          ctx.fill();

          ctx.translate(needle.x, needle.y);
          ctx.rotate(needle.ang);
          for (const s of [-0.32, 0.32]) {
            ctx.save();
            ctx.rotate(s);
            ctx.strokeStyle = "rgba(255,238,214,0.75)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-48, 0);
            ctx.lineTo(32, 0);
            ctx.stroke();
            ctx.fillStyle = "rgba(255,244,226,0.9)";
            ctx.beginPath();
            ctx.arc(-50, 0, 3.2, 0, 6.283);
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }

        // the giving
        if (act === GIVE) {
          if (child.a > 0.02) drawFigure(child, POSES.reach);
          const hxp = jx("handF", hero), hyp = jy("handF", hero);
          const cxp = px(POSES.reach, "head", child), cyp = py(POSES.reach, "head", child) - child.s * 5;
          const u = handoff;
          if (u > 0) {
            const e = u * u * (3 - 2 * u);
            drawHat(hxp + (cxp - hxp) * e, hyp + (cyp - hyp) * e - Math.sin(e * 3.14) * hero.s * 14, hero.s * 7, Math.min(1, u * 3));
          }
        }

        // the murk
        if (murk > 0.01) {
          const th = H * (0.18 + murk * 0.95);
          const tg = ctx.createLinearGradient(0, H, 0, H - th);
          tg.addColorStop(0, "rgba(102,110,124," + (0.6 * murk).toFixed(3) + ")");
          tg.addColorStop(0.5, "rgba(88,96,112," + (0.3 * murk).toFixed(3) + ")");
          tg.addColorStop(1, "rgba(80,88,104," + (0.14 * murk).toFixed(3) + ")");
          ctx.fillStyle = tg;
          ctx.fillRect(0, H - th, W, th);
        }

        if (flash > 0.01) {
          ctx.fillStyle = "rgba(226,240,255," + (flash * 0.5).toFixed(3) + ")";
          ctx.fillRect(0, 0, W, H);
        }

        // what he works out for himself, and keeps
        if (act === HANDS) {
          const mark = MARKS.reduce((a, m, i) => (prog >= m ? i : a), -1);
          if (mark > quoteIdx) {
            quoteIdx = mark;
            said.push({ lines: QUOTES[mark], t: 0, s: SLOTS[mark] });
          }
        }
        const rest = 0.46 + bloom * 0.42;
        const qfs = Math.max(16, Math.min(27, W * 0.021));
        for (const q of said) {
          q.t += dt;
          const loud = Math.min(1, Math.max(0, 7 - q.t) / 3);
          const a = Math.min(1, q.t / 1.5) * (rest + (1 - rest) * loud);
          const bob = Math.sin(t * 0.5 + q.s[1] * 9) * 3;
          say(q.lines, W * q.s[0], H * q.s[1] + bob, qfs * (1 + loud * 0.1), a, 322, null, q.s[2]);
        }

        // narration
        if (caption) {
          const a = Math.min(1, (at - caption.when) / 1.1) * Math.min(1, (caption.when + caption.dur - at) / 1.1);
          const fs = Math.max(19, Math.min(33, W * 0.026));
          say(caption.lines, W / 2, H * 0.88, fs, Math.max(0, a), act === GIVE ? 30 : 322);
        }

        if (act === HANDS && opening < 7 && !pointer.has) {
          const a = Math.min(1, opening / 1.5) * Math.min(1, (7 - opening) / 2);
          say(["move your hands"], W / 2, H - 54, 13, a * 0.8, 322, MONO);
        }

        if (act < HANDS) {
          ctx.save();
          ctx.globalAlpha = 0.16 + 0.1 * Math.sin(t * 2);
          ctx.textAlign = "right";
          ctx.font = "10px " + MONO;
          ctx.fillStyle = "rgba(226,232,240,0.9)";
          ctx.fillText("click", W - 18, H - 18);
          ctx.restore();
        }

        // grain + vignette
        if (!LOW) {
          ctx.save();
          ctx.globalAlpha = 0.06 + murk * 0.05;
          ctx.translate(-(Math.random() * 128) | 0, -(Math.random() * 128) | 0);
          ctx.fillStyle = grain;
          ctx.fillRect(0, 0, W + 128, H + 128);
          ctx.restore();
        }
        const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.76);
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(0,0,0," + (0.6 - bloom * 0.22).toFixed(2) + ")");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }

      /* ================= hands ================= */

      function move(x, y) {
        pointer.x = x;
        pointer.y = y;
        if (!pointer.has) {
          pointer.has = true;
          needle.x = needle.px = x;
          needle.y = needle.py = y;
        }
      }
      addEventListener("mousemove", (e) => move(e.clientX, e.clientY));
      addEventListener("mousedown", () => advance());
      addEventListener("touchstart", (e) => { move(e.touches[0].clientX, e.touches[0].clientY); advance(); });
      addEventListener("touchmove", (e) => { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
      addEventListener("keydown", (e) => {
        if (e.key === " ") { e.preventDefault(); advance(); }
        if (e.key === "r" || e.key === "R") {
          stitches = [];
          filled.clear();
          fx.clearRect(0, 0, W, H);
          smlDirty = true;
          hatFilled = 0;
          said = [];
          quoteIdx = -1;
          caption = null;
          bloom = 0;
          handoff = 0;
          child.a = 0;
          agents = [];
          act = COMMUTE;
          at = 0;
          lens = 0;
          hollow = 0;
          fall = 0;
          hero.wire = 0;
          hero.warm = 0;
          hero.a = 1;
          pointer.has = false;
          snapPose("sit");
          stage();
        }
      });

      let rt;
      addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 140); });

      needle.x = innerWidth / 2;
      needle.y = innerHeight / 2;
      snapPose("sit");
      resize();
      requestAnimationFrame((n) => { last = n; frame(n); });
    </script>
  </body>
</html>
